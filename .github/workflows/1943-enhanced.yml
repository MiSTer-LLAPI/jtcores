{
  "name": "1943 Enhanced P1 extended poll ACK",
  "on": {
    "push": {
      "branches": [
        "test-1943-gp-ack40"
      ],
      "paths": [
        ".github/workflows/1943-enhanced.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "test-1943-gp-ack40",
    "cancel-in-progress": true
  },
  "jobs": {
    "candidate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "env": {
        "VARIANT": "candidate",
        "BUILD_IMAGE": "jotego/jtcore20@sha256:a0397645aeac483f90718c89e5fd491c4889db6e4202bcba7f7f7770e14beb6b",
        "LLAPI_TEST_VARIANT": "${{ matrix.variant }}",
        "LLAPI_TEST_TITLE": "${{ matrix.title }}",
        "LLAPI_TEST_RBF": "${{ matrix.rbf }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "660989b25f735814224dc3535db931041861f568",
            "persist-credentials": false,
            "repository": "jotego/jtcores"
          }
        },
        {
          "name": "Fetch exact baseline submodules",
          "run": "git submodule update --init --recursive --depth 1 $(git ls-files --stage modules | awk '$1 == 160000 && $4 ~ /\\/(fx68k|jt51|jt12|jt6295|jt5205|jt7759|jt8255|jt8051|jtdsp16|jtopl|jtkcpu|jt007232)$/ {print $4}')"
        },
        {
          "name": "Restore pinned shared Enhanced menu sources",
          "run": "curl -fsSL --retry 3 https://raw.githubusercontent.com/$GITHUB_REPOSITORY/a5d760a27c09aea53071788038d8a66512365be8/.github/workflows/contra-poll-diagnostic.yml -o /tmp/shared.json\npython3 - <<'PYCODE'\nimport json,subprocess\nfor s in json.load(open('/tmp/shared.json'))['jobs']['candidate']['steps'][2:6]:\n subprocess.run(['bash','-e'],input=s['run'].replace('$GITHUB_SHA','a5d760a27c09aea53071788038d8a66512365be8'),text=True,check=True)\nPYCODE"
        },
        {
          "name": "Load 1944 integration 1",
          "run": "echo '' >> /tmp/1944.b64"
        },
        {
          "name": "Load 1944 integration 2",
          "run": "echo '' >> /tmp/1944.b64"
        },
        {
          "name": "Load 1944 integration 3",
          "run": "echo '' >> /tmp/1944.b64"
        },
        {
          "name": "Load 1944 integration 4",
          "run": "echo '' >> /tmp/1944.b64"
        },
        {
          "name": "Apply verified driver and menu sources",
          "run": "python3 - <<'PYCODE'\nimport base64,gzip,hashlib,json\nfrom pathlib import Path\ndata=base64.b64decode(Path('/tmp/1944.b64').read_bytes())\nassert hashlib.sha256(data).hexdigest()=='0731bb5551662d517967045245291b7c39398546fe21b65dcc73a5db8e0b91ce'\nfor name,s in json.loads(gzip.decompress(data)).items():Path(name).write_text(s)\nPYCODE"
        },
        {
          "name": "Apply verified P1 comparison patch",
          "run": "set -eu\npython3 - <<'PYCOMPAT'\nimport json,hashlib,os,subprocess\nfrom pathlib import Path\npayload=json.loads('{\"gpmode\": {\"before\": {\"modules/jtframe/target/mister/hdl/jtframe_llapi_protocol.sv\": \"663fec20a1bb8a799f7b883adcc4d09dc02e8ca60d60760e352abe2b7e23abee\", \"modules/jtframe/target/mister/hdl/jtframe_llapi_arcade.sv\": \"5653586a496236565652eebfea0541b30085975ce20f2b2427b8f0f522011a8e\", \"modules/jtframe/target/mister/hdl/jtframe_serial_arcade.sv\": \"c2d754cc69de8c8f17bead80432fee210c4d48fd6072ebc37671686291c37f4d\", \"modules/jtframe/target/mister/cfgstr\": \"7aad44f03057edc9a7f69a427a66fe5120ce1c3d36e809b80316ccb343c299b8\", \"modules/jtframe/target/mister/hdl/sys/hps_io.sv\": \"904fbf859b2f578b31ca4d46cb8792839e4c1abb38ccc6f41151fdb8ffecf28f\"}, \"after\": {\"modules/jtframe/target/mister/hdl/jtframe_llapi_protocol.sv\": \"cc3a354579bf2d7e61d37d9c7cc35c090afaa3ea6f8549ed4b8495b77bc484d9\", \"modules/jtframe/target/mister/hdl/jtframe_llapi_arcade.sv\": \"69c7d06b4178f521332e84a826c6c8331fcfccd7348c3ab4093517e8a410ec48\", \"modules/jtframe/target/mister/hdl/jtframe_serial_arcade.sv\": \"4afb3485b4f7db911cb157bacfb13d17dbb644390353991f9e3a463952c804ae\", \"modules/jtframe/target/mister/cfgstr\": \"f5dc56cb23ee5b8eff777d5db9aa09d06312da9103316e593342125c9d9150ea\", \"modules/jtframe/target/mister/hdl/sys/hps_io.sv\": \"3dcd63f95b7a5b2e512a8bc97b492f1e5f8763237f8b77e5a491e4aa37092da3\"}, \"patches\": [\"--- a/modules/jtframe/target/mister/hdl/jtframe_llapi_protocol.sv\\\\n+++ b/modules/jtframe/target/mister/hdl/jtframe_llapi_protocol.sv\\\\n@@ -773,3 +773,455 @@\\\\n         end\\\\n     end\\\\n endmodule\\\\n+\\\\n+// P1 comparison transport from the working 1943 Experimental, d975bfe.\\\\n+/* HDL implementation of Low-Latency API protocol\\\\n+*\\\\n+* Copyright 2019 Jamie Dickson aka Kitrinx\\\\n+*\\\\n+* Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated\\\\n+* documentation files (the \\\\\"Software\\\\\"), to deal in the Software without restriction, including without limitation\\\\n+* the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software,\\\\n+* and to permit persons to whom the Software is furnished to do so, subject to the following conditions:\\\\n+*\\\\n+* The above copyright notice and this permission notice shall be included in all copies or substantial portions\\\\n+* of the Software.\\\\n+*\\\\n+* THE SOFTWARE IS PROVIDED \\\\\"AS IS\\\\\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED\\\\n+* TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL\\\\n+* THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF\\\\n+* CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS\\\\n+* IN THE SOFTWARE.\\\\n+*/\\\\n+\\\\n+// Feb, 1 2019 - Initial Release\\\\n+\\\\n+// ***** NOTE ******\\\\n+// On IO board 5.5 the bliss box requires external pull-up resistors to communicate properly\\\\n+\\\\n+// Data payload bit order:\\\\n+\\\\n+// Byte 0:\\\\n+// uint8_t Controller Type (or error code)\\\\n+// Notable ID\\'s are:\\\\n+// 18 - NES\\\\n+// 21 - Gen 3 button\\\\n+// 22 - Gen 6 button\\\\n+// 27 - SNES\\\\n+// 28 - NES Zapper\\\\n+// 41 - Atari Paddles\\\\n+// 51 - NeGcon\\\\n+// 65 - PSX Digital\\\\n+// 11 - PSX DS\\\\n+// 12 - PSX DS2\\\\n+// more info: https://docs.google.com/document/d/12XpxrmKYx_jgfEPyw-O2zex1kTQZZ-NSBdLO2RQPRzM/edit\\\\n+\\\\n+// Bytes 1-2:\\\\n+// Buttons\\\\n+// XXX: These are not accurate in 3.0, see the linked document instead\\\\n+// System SNES    Genesis PSX    Gun   Saturn\\\\n+//  0:     Y       A       \\\\u25a1      Click A\\\\n+//  1:     B       B       \\\\u00d7      Light B\\\\n+//  2:     X       X       \\\\u25b3      NA    X\\\\n+//  3:     A       Y       \\\\u25cb      NA    Y\\\\n+//  4:     Select  Mode    Select NA    NA\\\\n+//  5:     Start   Start   Start  NA    Start\\\\n+//  6:     LT      NA      L1     NA    L\\\\n+//  7:     RT      NA      R1     NA    R\\\\n+\\\\n+//  8:     NA      Z       L2     NA    Z\\\\n+//  9:     NA      C       R2     NA    C\\\\n+// 10:     U       U       U      NA    NA\\\\n+// 11:     D       D       D      NA    NA\\\\n+// 12:     L       L       L      NA    NA\\\\n+// 13:     R       R       R      NA    NA\\\\n+// 14:     0       NA      L3     NA    NA\\\\n+// 15:     1       NA      R3     NA    NA\\\\n+\\\\n+// 16:     2       NA      NA     NA    NA\\\\n+// 17:     3       NA      NA     NA    NA\\\\n+// 18:     4       NA      NA     NA    NA\\\\n+// 19:     5       NA      NA     NA    NA\\\\n+// 20:     6       NA      NA     NA    NA\\\\n+// 21:     7       NA      NA     NA    NA\\\\n+// 22:     8       NA      NA     NA    NA\\\\n+// 23: This bit can be the \\\\\"special\\\\\" trigger button for retroarch\\\\n+// more info: https://docs.google.com/spreadsheets/d/1Bk3j5kaKfV1tOfzCq3GLKFsff027RdmwOuSfBLM3Ims/edit#gid=0\\\\n+\\\\n+// Bytes 4-12: (uint8_t\\'s)\\\\n+// 04: Axis 1 X\\\\n+// 05: Axis 1 Y\\\\n+// 06: Axis 1 Z\\\\n+// 07: Axis 2 X\\\\n+// 08: Axis 2 Y\\\\n+// 09: Axis 2 Z\\\\n+// 10: Slider\\\\n+// 11: Dial\\\\n+// 12: Hat\\\\n+\\\\n+// Modes:\\\\n+// 0: autopause state\\\\n+// 1:\\\\n+// 2:\\\\n+// 3: Hotswap Disabled\\\\n+// 4: UDLR mode\\\\n+// 5: Analog to D-pad\\\\n+// 6: autopause dis.\\\\n+// 7: d-pad only mode\\\\n+\\\\n+module LLAPI_LegacyP1\\\\n+(\\\\n+\\\\tinput         CLK_50M,\\\\n+\\\\tinput         ENABLE,        // If 0, module will be disabled and pins will be set to Z\\\\n+\\\\tinput         IO_LATCH_IN,   // D+ top level IO pin\\\\n+\\\\toutput logic  IO_LATCH_OUT,\\\\n+\\\\tinput         IO_DATA_IN,    // D- top level IO pin\\\\n+\\\\toutput logic  IO_DATA_OUT,\\\\n+\\\\tinput         LLAPI_SYNC,     // Pos edge corresponds with when the core needs the data, from core\\\\n+\\\\toutput        LLAPI_EN,       // High when device is communicating, passed to core\\\\n+\\\\toutput [7:0]  LLAPI_TYPE,     // Enumerated controller type, passed to core\\\\n+\\\\toutput [7:0]  LLAPI_MODES,    // Modes that the bliss box may be in, passed to core\\\\n+\\\\toutput [31:0] LLAPI_BUTTONS,  // Vector of buttons, 1 == pressed, passed to core\\\\n+\\\\toutput [71:0] LLAPI_ANALOG,\\\\n+\\\\toutput REPORT_UPDATE\\\\n+);\\\\n+\\\\n+// Commands\\\\n+enum bit [7:0] {\\\\n+\\\\tLLAPI_POLL               = 8\\'h00, // Holds latch low until done\\\\n+\\\\tLLAPI_STATUS             = 8\\'h01, // Returns 13 bytes, see above\\\\n+\\\\tLLAPI_PRESSURE_STATUS    = 8\\'h02, // Returns ?? bytes\\\\n+\\\\tLLAPI_SET_MODES          = 8\\'h20, // Requires 1 byte payload\\\\n+\\\\tLLAPI_GET_MODES          = 8\\'h21, // Returns bit field of active modes, 1 byte. see above\\\\n+\\\\t// Rumble\\\\n+\\\\tLLAPI_RUMBLE_CONST_START_FROM_PARMS = 8\\'h11, //must set parms first\\\\n+\\\\tLLAPI_RUBMLE_CONST_END              = 8\\'h12,\\\\n+\\\\tLLAPI_RUMBLE_SINE_START_FROM_PARMS  = 8\\'h14, //must set parms first\\\\n+\\\\tLLAPI_RUMBLE_SINE_END               = 8\\'h18,\\\\n+\\\\tLLAPI_RUMBLE_CONST_JOLT             = 8\\'h1A,\\\\n+\\\\tLLAPI_RUMBLE_SINE_JOLT              = 8\\'h1B,\\\\n+\\\\tLLAPI_RUMBLE_PARMS                  = 8\\'h1C //followed by 2 bytes of data containing the parms (rumbleLevel and then rumbleLoop)\\\\n+} commands;\\\\n+\\\\n+// Errors\\\\n+enum bit [7:0] {\\\\n+\\\\tLLAPI_ERROR_NODATA       = 8\\'h00,\\\\n+\\\\tLLAPI_ERROR_AP_NO_REPORT = 8\\'hFF\\\\n+} errors;\\\\n+\\\\n+// Timing (one 50mhz cycle == 0.02us)\\\\n+enum bit [20:0] {\\\\n+\\\\tTIME_POLL   = 21\\'d350000, // 7ms - default polling period if no sync is used\\\\n+\\\\tTIME_SETTLE = 21\\'d150,    // 3us - to account for bidirectional IO pins slew rate\\\\n+\\\\tTIME_WAIT   = 21\\'d500,    // 10us - time to wait after a reply before writing again\\\\n+\\\\tTIME_LEADIN = 21\\'d84,     // 1.5us - at start of new transactions\\\\n+\\\\tTIME_BIT_H  = 21\\'d109,    // 2.2us - always-high first bit-half\\\\n+\\\\tTIME_BIT_R  = 21\\'d115,    // 2.3us - variable second bit-half\\\\n+\\\\tTIME_SYNC_H = 21\\'d49,     // 1us - sync pulse between bytes high time\\\\n+\\\\tTIME_SYNC_L = 21\\'d50,     // 1us - sync pulse between bytes low time\\\\n+\\\\tTIME_BUFFER = 21\\'d9500    // 3 scanlines of wiggle room\\\\n+} time_periods;\\\\n+\\\\n+typedef enum bit [2:0] {\\\\n+\\\\tREAD_IDLE,\\\\n+\\\\tREAD_POLL,\\\\n+\\\\tWRITE_STATUS,\\\\n+\\\\tREAD_STATUS,\\\\n+\\\\tWRITE_SETUP,\\\\n+\\\\tWRITE_MODES,\\\\n+\\\\tREAD_MODES\\\\n+} execution_stage;\\\\n+\\\\n+typedef enum bit [3:0] {\\\\n+\\\\tSTATE_IDLE,\\\\n+\\\\tSTATE_WRITE_START,\\\\n+\\\\tSTATE_WRITE,\\\\n+\\\\tSTATE_WRITE_END,\\\\n+\\\\tSTATE_READ_START,\\\\n+\\\\tSTATE_READ_WAIT,\\\\n+\\\\tSTATE_READ,\\\\n+\\\\tSTATE_READ_END\\\\n+} execution_state;\\\\n+\\\\n+logic [20:0]  cycle, count, poll_offset, poll_counter, poll_offset_latch, sync_counter;\\\\n+logic [31:0]  write_buffer;\\\\n+logic [3:0]   write_length;\\\\n+logic [2:0]   read_bit; // Relies on overflow\\\\n+logic [3:0]   read_byte;\\\\n+logic [7:0]   read_buffer[13];\\\\n+logic [3:0]   read_length;\\\\n+\\\\n+logic [31:0]  lljs_buttons;\\\\n+logic [71:0]  lljs_analog;\\\\n+logic [7:0]   lljs_type;\\\\n+logic [7:0]   lljs_modes;\\\\n+\\\\n+reg   [20:0]  poll_time = TIME_POLL;\\\\n+\\\\n+logic latch;\\\\n+logic is_latched;\\\\n+logic data_in, data_out;\\\\n+logic enable;\\\\n+logic old_sync, new_sync, old_data;\\\\n+\\\\n+execution_stage stage = READ_IDLE;\\\\n+execution_state state = STATE_IDLE;\\\\n+\\\\n+assign LLAPI_TYPE = lljs_type;\\\\n+assign LLAPI_BUTTONS = lljs_buttons;\\\\n+assign LLAPI_ANALOG = lljs_analog;\\\\n+assign LLAPI_MODES = lljs_modes;\\\\n+assign LLAPI_EN = enable;\\\\n+// Passive report strobe for the existing Enhanced Controller Guide telemetry.\\\\n+assign REPORT_UPDATE = ENABLE && is_latched && state == STATE_READ &&\\\\n+    cycle >= TIME_BIT_H + TIME_BIT_R && read_bit == 0 &&\\\\n+    stage == READ_STATUS && read_byte == 12;\\\\n+\\\\n+always_comb begin\\\\n+\\\\tif (latch) begin\\\\n+\\\\t\\\\tIO_LATCH_OUT = 1\\'b0;\\\\n+\\\\t\\\\tIO_DATA_OUT = data_out;\\\\n+\\\\tend else begin\\\\n+\\\\t\\\\tIO_LATCH_OUT = 1\\'b1;\\\\n+\\\\t\\\\tIO_DATA_OUT = 1\\'b1;\\\\n+\\\\tend\\\\n+end\\\\n+\\\\n+always_ff @(posedge CLK_50M) begin\\\\n+\\\\tif (ENABLE) begin\\\\n+\\\\told_sync <= new_sync;\\\\n+\\\\tnew_sync <= LLAPI_SYNC;\\\\n+\\\\tcycle <= cycle + 1\\'b1;\\\\n+\\\\n+\\\\tif (~latch) begin\\\\n+\\\\t\\\\tis_latched <= ~IO_LATCH_IN;\\\\n+\\\\t\\\\told_data <= data_in;\\\\n+\\\\t\\\\tdata_in <= IO_DATA_IN;\\\\n+\\\\tend\\\\n+\\\\n+\\\\tif (~old_sync && new_sync && sync_counter > poll_offset_latch) begin\\\\n+\\\\t\\\\tsync_counter <= 0;\\\\n+\\\\t\\\\tpoll_time <= poll_counter - 21\\'d9500; // about 3 scanlines of wobble room\\\\n+\\\\t\\\\tpoll_counter <= 0;\\\\n+\\\\tend else begin\\\\n+\\\\t\\\\tsync_counter <= sync_counter + 1\\'b1;\\\\n+\\\\t\\\\tpoll_counter <= poll_counter + 1\\'b1;\\\\n+\\\\tend\\\\n+\\\\n+\\\\tif (stage == READ_POLL || stage == READ_STATUS)\\\\n+\\\\t\\\\tpoll_offset <= poll_offset + 1\\'b1;\\\\n+\\\\n+\\\\tcase (state)\\\\n+\\\\t\\\\tSTATE_IDLE: begin\\\\n+\\\\t\\\\t\\\\tif (is_latched) begin // remote device wants to talk\\\\n+\\\\t\\\\t\\\\t\\\\tenable <= 1\\'b1;\\\\n+\\\\t\\\\t\\\\t\\\\tcycle <= 0;\\\\n+\\\\t\\\\t\\\\t\\\\tcount <= 0;\\\\n+\\\\t\\\\t\\\\t\\\\tread_byte <= 0;\\\\n+\\\\t\\\\t\\\\t\\\\tstate <= STATE_READ_START;\\\\n+\\\\t\\\\t\\\\tend else if (stage == WRITE_STATUS) begin // We just got a poll result\\\\n+\\\\t\\\\t\\\\t\\\\tif (cycle > TIME_WAIT) begin\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tcycle <= 0;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tstate <= STATE_WRITE_START;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tstage <= READ_STATUS;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tread_length <= \\'d13;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\twrite_buffer <= {24\\'d0, LLAPI_STATUS};\\\\n+\\\\t\\\\t\\\\t\\\\tend\\\\n+\\\\t\\\\t\\\\tend else if (stage == WRITE_MODES) begin\\\\n+\\\\t\\\\t\\\\t\\\\tif (cycle > TIME_WAIT) begin\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tcycle <= 0;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tstage <= READ_MODES;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tread_length <= 1\\'d1;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tstate <= STATE_WRITE_START;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\twrite_buffer <= {24\\'d0, LLAPI_GET_MODES};\\\\n+\\\\t\\\\t\\\\t\\\\tend\\\\n+\\\\t\\\\t\\\\tend else if (sync_counter >= (((poll_offset < (poll_time - TIME_BUFFER)) && enable) ?\\\\n+\\\\t\\\\t\\\\t\\\\t(poll_time - poll_offset) : poll_time)) begin // Trigger timed device poll. Offset can not be > half the poll time.\\\\n+\\\\t\\\\t\\\\t\\\\tcount <= count + 1\\'b1;\\\\n+\\\\t\\\\t\\\\t\\\\tif (count > TIME_WAIT) begin\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tif (stage != READ_IDLE) begin // IO timeout, device disconnect/defunct\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\t\\\\tenable <= 1\\'b0;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\t\\\\tpoll_offset <= 0;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\t\\\\tpoll_time <= poll_offset_latch > TIME_BUFFER ? poll_offset_latch : TIME_POLL;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\t\\\\tpoll_offset_latch <= 21\\'d350000;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\t\\\\tlljs_buttons <= 24\\'h0;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\t\\\\tlljs_type <= 8\\'h0;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\t\\\\tlljs_analog <= 48\\'h808080808080;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tend\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tpoll_offset <= 0;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tsync_counter <= 0;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tcycle <= 0;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tcount <= 0;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tread_length <= 0;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tstate <= STATE_WRITE_START;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\tstage <= READ_POLL;\\\\n+\\\\t\\\\t\\\\t\\\\t\\\\twrite_buffer <= {24\\'d0, LLAPI_POLL};\\\\n+\\\\t\\\\t\\\\t\\\\tend\\\\n+\\\\t\\\\t\\\\tend\\\\n+\\\\t\\\\tend\\\\n+\\\\n+\\\\t\\\\tSTATE_WRITE_START: begin\\\\n+\\\\t\\\\t\\\\tif (cycle == 0) begin\\\\n+\\\\t\\\\t\
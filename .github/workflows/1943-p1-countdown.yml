{
  "name": "1943 simplified menu and P1 reconnect countdown",
  "on": {
    "push": {
      "branches": [
        "enhanced-1943-p1-countdown"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "1943-p1-countdown",
    "cancel-in-progress": false
  },
  "jobs": {
    "candidate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "env": {
        "VARIANT": "candidate",
        "BUILD_IMAGE": "jotego/jtcore20@sha256:a0397645aeac483f90718c89e5fd491c4889db6e4202bcba7f7f7770e14beb6b"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "b222692d4c0c9a26a6cb3c99c6820b1ed4a5d565",
            "persist-credentials": false,
            "sparse-checkout": "cores/1944\ncores/cps1\ncores/cps15\ncores/cps2\nmodules/jtframe\nmodules/jteeprom\nmodules/fx68k\nmodules/jtdsp16\nmodules/jt12\ntests/llapi\ncores/1943\ncores/trojan\ncores/gng\nmodules/jt8051"
          }
        },
        {
          "name": "Fetch exact baseline submodules",
          "run": "git submodule update --init --recursive --depth 1 modules/fx68k modules/jtdsp16 modules/jt12"
        },
        {
          "name": "Apply verified Enhanced integration and record source",
          "run": "set -euo pipefail\npython3 - <<'PYCODE'\nfrom pathlib import Path\nimport base64,hashlib,subprocess\np=Path('/tmp/enhanced.patch')\np.write_bytes(__import__('gzip').decompress(base64.b64decode('')))\nassert hashlib.sha256(p.read_bytes()).hexdigest()=='ffc732467558d276e4e722cbc1b12d7f343d1c8e0b2782e8fe08a2ee30031bcf'\nsubprocess.run(['git','apply','--check',str(p)],check=True)\nsubprocess.run(['git','apply',str(p)],check=True)\np=Path('tests/llapi/build-1944.sh');s=p.read_text();assert 'for seed in 1 2 3; do' in s;p.write_text(s.replace('for seed in 1 2 3; do','for seed in 1; do'))\nPYCODE\nmkdir -p comparison-provenance\ncp /tmp/enhanced.patch comparison-provenance/\ngit rev-parse HEAD > comparison-provenance/base-commit.txt\ngit diff --binary > comparison-provenance/tracked-patch.diff\nfind cores/1944 cores/cps1 modules/jtframe/target/mister tests/llapi -type f -print0 | sort -z | xargs -0 sha256sum > comparison-provenance/source-sha256.txt\nprintf '%s\\n' \"$BUILD_IMAGE\" > comparison-provenance/container.txt\n\npython3 - <<'PY1943'\nfrom pathlib import Path\nimport base64,hashlib\np=Path('cores/1943/cfg/macros.def');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(''));assert hashlib.sha256(p.read_bytes()).hexdigest()=='9d6dfe0fea2b9d0a985d39750b9ac7352b3e1a015aa9b25275a6eb65d7e89281'\np=Path('tests/llapi/pce_nes_integration_tb.sv');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(__import__('gzip').decompress(base64.b64decode('')));assert hashlib.sha256(p.read_bytes()).hexdigest()=='fb36895d640e03720c7b620fd964d49932e6d0dee2379bd4897d5f3cc0667f5e'\np=Path('tests/llapi/run_pce_nes.py');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(__import__('gzip').decompress(base64.b64decode('')));assert hashlib.sha256(p.read_bytes()).hexdigest()=='508c83dfcff1ed006559a718d49028d700110f92c428e60bda60912569b1aac3'\np=Path('tests/llapi/build-1943.sh');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(__import__('gzip').decompress(base64.b64decode('')));assert hashlib.sha256(p.read_bytes()).hexdigest()=='fe6f4f49b32e209418ab170a1a824a4b5929fec2e588bbab6fb74284b30df12e'\np=Path('tests/llapi/1943-LLAPI-Enhanced.mra');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(__import__('gzip').decompress(base64.b64decode('')));assert hashlib.sha256(p.read_bytes()).hexdigest()=='aa76b04bf754c9385a3cc7a910d8007189ae29494a84e52c764c7622f8fd5b3a'\np=Path('tests/llapi/README.md');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(__import__('gzip').decompress(base64.b64decode('')));assert hashlib.sha256(p.read_bytes()).hexdigest()=='55e8247d544a17144811a9b9ba5b1aa9fa5a2b9f3b7966828d2f0ade6afbff2b'\nPY1943\nfind cores/1943 tests/llapi -type f -print0 | sort -z | xargs -0 sha256sum > comparison-provenance/1943-sha256.txt\n"
        },
        {
          "name": "Apply pinned controls feature overlay",
          "run": "set -euo pipefail\npython3 - <<'PYOVERLAY'\nimport json,base64,hashlib\nfrom pathlib import Path\nrows=json.loads(__import__('gzip').decompress(base64.b64decode('')))\nfor r in rows:\n p=Path(r['path']);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(r['data']));assert hashlib.sha256(p.read_bytes()).hexdigest()==r['sha256']\nPath('comparison-provenance/features-sha256.json').write_text(json.dumps([{k:v for k,v in r.items() if k!='data'} for r in rows],indent=2))\nPYOVERLAY\n"
        },
        {
          "name": "Check controls and serial modes",
          "run": "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y iverilog\npython3 tests/llapi/run_pce_nes.py pilot-reports/controller-tests\n\nh=modules/jtframe/target/mister/hdl\niverilog -g2012 -DJTFRAME_LLAPI_HOLD_AUTOFIRE -DJTFRAME_ENHANCED_CONTROLS -s enhanced_controls_tb -o /tmp/controls.vvp tests/llapi/enhanced_controls_tb.sv \"$h/jtframe_serial_arcade.sv\" \"$h/jtframe_llapi_arcade.sv\" \"$h/jtframe_llapi_protocol.sv\" \"$h/joydb15.v\"\nvvp /tmp/controls.vvp\niverilog -g2012 -DJTFRAME_ENHANCED_CONTROLS -s controller_info_bridge_tb -o /tmp/info.vvp tests/llapi/controller_info_bridge_tb.sv \"$h/jtframe_llapi_arcade.sv\" \"$h/jtframe_llapi_protocol.sv\"\nvvp /tmp/info.vvp\n\niverilog -g2012 -s controller_loss_pause_tb -o /tmp/loss.vvp tests/llapi/controller_loss_pause_tb.sv tests/llapi/controller_loss_pause.sv\nvvp /tmp/loss.vvp\niverilog -g2012 -DJTFRAME_ENHANCED_CONTROLS -s dual_wire_lifecycle_tb -o /tmp/wireloss.vvp tests/llapi/dual_wire_loss_tb.sv \"$h/jtframe_llapi_arcade.sv\" \"$h/jtframe_llapi_protocol.sv\"\nvvp /tmp/wireloss.vvp\npython3 tests/llapi/extract_pause_visual.py\niverilog -g2012 -s pause_fade_tb -o /tmp/fade.vvp /tmp/pause_visual_actual.sv\nvvp /tmp/fade.vvp\npython3 tests/llapi/extract_pause_audio.py\niverilog -g2012 -DMISTER -s pause_audio_tb -o /tmp/audio.vvp /tmp/pause_audio_actual.sv modules/jtframe/hdl/jtframe_dip.v\nvvp /tmp/audio.vvp\n\n# Validate actual compiled menu transport and generator, not a mock menu.\nexport JTROOT=\"$PWD\" JTFRAME=\"$PWD/modules/jtframe\" CORES=\"$PWD/cores\" MODULES=\"$PWD/modules\" JTBIN=\"$PWD/release\"\n(cd modules/jtframe/src/jtframe && go test ./cfgstr && go build -o /tmp/1943-jtframe .)\n(cd /tmp && /tmp/1943-jtframe cfgstr 1943 -t mister)\niverilog -g2012 -DJTFRAME_ENHANCED_CONTROLS -s controller_info_hps_tb -o /tmp/hps.vvp tests/llapi/controller_info_hps_tb.sv \"$h/sys/hps_io.sv\"\n(cd /tmp && vvp /tmp/hps.vvp)\npython3 - <<'PYSCROLL'\nfrom pathlib import Path\ns=Path('modules/jtframe/hdl/jtframe_board.v').read_text()\nPath('/tmp/production-scroll.sv').write_text(s[s.index('module paused_scroll #'):].replace('`endif',''))\ns=Path('modules/jtframe/target/mister/hdl/sys/hps_io.sv').read_text()\nPath('/tmp/production-guide.sv').write_text(s[s.index('module selected_interface_guide'):].replace('`endif',''))\nPYSCROLL\niverilog -g2012 -s paused_scroll_video_tb -o /tmp/scroll.vvp tests/llapi/paused_scroll_video_tb.sv /tmp/production-scroll.sv\nvvp /tmp/scroll.vvp\niverilog -g2012 -s selected_interface_guide_tb -o /tmp/guide.vvp tests/llapi/selected_interface_guide_tb.sv /tmp/production-guide.sv\nvvp /tmp/guide.vvp\n"
        },
        {
          "name": "Compile with unchanged clocks and strict timing acceptance",
          "run": "docker run --rm --network host --entrypoint /bin/bash -v \"$GITHUB_WORKSPACE:/jtcores\" -w /jtcores \"$BUILD_IMAGE\" /jtcores/tests/llapi/build-1943.sh"
        },
        {
          "name": "Preserve comparison reports and test artifacts",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "1943-enhanced-${{ github.run_id }}",
            "retention-days": 30,
            "path": "comparison-provenance/\npilot-build/\npilot-reports/\nlog/mister/\ncores/1943/mister/*.qsf\ncores/1943/mister/*.sdc\ncores/1943/mister/output_files/*.rpt\ncores/1943/mister/output_files/*.summary\n**/*.sdc\n**/*.qsf"
          }
        }
      ]
    }
  }
}

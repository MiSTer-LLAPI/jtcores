{
  "name": "1944 legacy versus Enhanced comparison",
  "on": {
    "push": {
      "branches": [
        "enhanced-1944-comparison"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "enhanced-1944-comparison",
    "cancel-in-progress": false
  },
  "jobs": {
    "image": {
      "runs-on": "ubuntu-24.04",
      "outputs": {
        "image": "${{ steps.resolve.outputs.image }}"
      },
      "steps": [
        {
          "id": "resolve",
          "run": "docker pull jotego/jtcore20\nimage=$(docker image inspect jotego/jtcore20 --format '{{index .RepoDigests 0}}')\ntest -n \"$image\"\necho \"image=$image\" >> \"$GITHUB_OUTPUT\"\n"
        }
      ]
    },
    "compare": {
      "needs": "image",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 240,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 2,
        "matrix": {
          "variant": [
            "baseline",
            "candidate"
          ]
        }
      },
      "env": {
        "VARIANT": "${{ matrix.variant }}",
        "BUILD_IMAGE": "${{ needs.image.outputs.image }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "${{ matrix.variant == 'candidate' && 'b222692d4c0c9a26a6cb3c99c6820b1ed4a5d565' || '45c72354ee2e9f63027d13ae066b283b7e8fb31e' }}",
            "persist-credentials": false,
            "sparse-checkout": "cores/1944\ncores/cps1\ncores/cps15\ncores/cps2\nmodules/jtframe\nmodules/jteeprom\nmodules/fx68k\nmodules/jtdsp16\nmodules/jt12\ntests/llapi"
          }
        },
        {
          "name": "Fetch exact baseline submodules",
          "run": "git submodule update --init --recursive --depth 1 modules/fx68k modules/jtdsp16 modules/jt12"
        },
        {
          "name": "Prepare matched seed-1 source and record patch",
          "run": "python3 - <<'PYCODE'\nfrom pathlib import Path\nimport os,base64,subprocess\nif os.environ['VARIANT']=='candidate':\n p=Path('/tmp/1944-clean-integration.patch')\n p.write_bytes(base64.b64decode(''))\n subprocess.run(['git','apply','--check',str(p)],check=True)\n subprocess.run(['git','apply',str(p)],check=True)\np=Path('tests/llapi/build-1944.sh')\ns=p.read_text();assert 'for seed in 1 2 3; do' in s\np.write_text(s.replace('for seed in 1 2 3; do','for seed in 1; do'))\nPYCODE\nmkdir -p comparison-provenance\ngit rev-parse HEAD > comparison-provenance/base-commit.txt\ngit diff --binary > comparison-provenance/tracked-patch.diff\ngit ls-files --others --exclude-standard > comparison-provenance/added-files.txt\nfind cores/1944 modules/jtframe/target/mister tests/llapi -type f -print0 | sort -z | xargs -0 sha256sum > comparison-provenance/integration-sha256.txt\nprintf '%s\\n' \"$BUILD_IMAGE\" > comparison-provenance/container.txt\n"
        },
        {
          "name": "Check controls and serial modes",
          "run": "set -euo pipefail\nsudo apt-get update -qq && sudo apt-get install -y iverilog\nh=modules/jtframe/target/mister/hdl\nfor entry in 'hold_1943_tb llapi_free_buttons_tb.sv -Phold_1943_tb.BUTTONS=2' 'serial_modes_tb serial_modes_tb.sv' 'snac_readers_tb snac_free_buttons_tb.sv' 'db15_reader_tb db15_reader_tb.sv'; do\n read -r top test extra <<< \"$entry\"\n iverilog -g2012 -DJTFRAME_LLAPI_HOLD_AUTOFIRE -s \"$top\" ${extra:-} -o /tmp/fixture \"tests/llapi/$test\" \"$h/jtframe_serial_arcade.sv\" \"$h/jtframe_llapi_arcade.sv\" \"$h/jtframe_llapi_protocol.sv\" \"$h/joydb15.v\"\n vvp /tmp/fixture\ndone\n"
        },
        {
          "name": "Compile with unchanged clocks and strict timing acceptance",
          "run": "docker run --rm --network host --entrypoint /bin/bash -v \"$GITHUB_WORKSPACE:/jtcores\" -w /jtcores \"$BUILD_IMAGE\" /jtcores/tests/llapi/build-1944.sh"
        },
        {
          "name": "Preserve comparison reports and test artifacts",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "1944-comparison-${{ matrix.variant }}-${{ github.run_id }}",
            "retention-days": 30,
            "path": "comparison-provenance/\npilot-build/\npilot-reports/\nlog/mister/\ncores/1944/mister/*.qsf\ncores/1944/mister/*.sdc\ncores/1944/mister/output_files/*.rpt\ncores/1944/mister/output_files/*.summary"
          }
        }
      ]
    }
  }
}

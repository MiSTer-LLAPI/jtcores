{
  "name": "Pac-Land Enhanced 1.0",
  "on": {
    "push": {
      "branches": [
        "test-paclan-enhanced-v1"
      ],
      "paths": [
        ".github/workflows/paclan-enhanced.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "paclan-enhanced-v1",
    "cancel-in-progress": false
  },
  "jobs": {
    "candidate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "env": {
        "VARIANT": "candidate",
        "BUILD_IMAGE": "jotego/jtcore20@sha256:a0397645aeac483f90718c89e5fd491c4889db6e4202bcba7f7f7770e14beb6b"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "b222692d4c0c9a26a6cb3c99c6820b1ed4a5d565",
            "persist-credentials": false
          }
        },
        {
          "name": "Fetch exact baseline submodules",
          "run": "git submodule update --init --recursive --depth 1 $(git ls-files --stage modules | awk '$1 == 160000 && $4 ~ /\\/(fx68k|jt51|jt12|jt6295|jt5205|jt7759|jt8255|jt8051|jtdsp16)$/ {print $4}')"
        },
        {
          "name": "Restore pinned shared Enhanced menu sources",
          "run": "curl -fsSL --retry 3 https://raw.githubusercontent.com/$GITHUB_REPOSITORY/a5d760a27c09aea53071788038d8a66512365be8/.github/workflows/contra-poll-diagnostic.yml -o /tmp/shared.json\npython3 - <<'PYCODE'\nimport json,subprocess\nfor s in json.load(open('/tmp/shared.json'))['jobs']['candidate']['steps'][2:6]:\n subprocess.run(['bash','-e'],input=s['run'].replace('$GITHUB_SHA','a5d760a27c09aea53071788038d8a66512365be8'),text=True,check=True)\nPYCODE"
        },
        {
          "name": "Load 1944 integration 1",
          "run": "echo '' >> /tmp/1944.b64"
        },
        {
          "name": "Load 1944 integration 2",
          "run": "echo '' >> /tmp/1944.b64"
        },
        {
          "name": "Load 1944 integration 3",
          "run": "echo '' >> /tmp/1944.b64"
        },
        {
          "name": "Load 1944 integration 4",
          "run": "echo '' >> /tmp/1944.b64"
        },
        {
          "name": "Apply verified driver and menu sources",
          "run": "python3 - <<'PYCODE'\nimport base64,gzip,hashlib,json\nfrom pathlib import Path\ndata=base64.b64decode(Path('/tmp/1944.b64').read_bytes())\nassert hashlib.sha256(data).hexdigest()=='0731bb5551662d517967045245291b7c39398546fe21b65dcc73a5db8e0b91ce'\nfor name,s in json.loads(gzip.decompress(data)).items():Path(name).write_text(s)\nPYCODE"
        },
        {
          "name": "Configure paclan controls",
          "run": "set -eu\ncat >> cores/paclan/cfg/macros.def <<'EOF'\n\n[mister]\nJTFRAME_BUTTONS=3\nJTFRAME_LLAPI_HOLD_AUTOFIRE\nJTFRAME_LLAPI_AUTOFIRE_OPTIONS\nJTFRAME_LLAPI\nJTFRAME_NO_DB15\nJTFRAME_SNAC_PCE_NES\nJTFRAME_ENHANCED_CONTROLS\nJTFRAME_LLAPI_HIDE_DIAGNOSTICS\nEOF\nsed -e 's@cores/1944/mister@cores/paclan/mister@g' -e 's/jt1944/jtpaclan/g' tests/llapi/check-1944-timing.py > tests/llapi/check-paclan-timing.py\nsed -e 's/jtcore 1944 /jtcore paclan /g' -e 's/jt1944/jtpaclan/g' -e 's/check-1944/check-paclan/g' -e '/^mkdir -p pilot-build/,$d' tests/llapi/build-1944.sh > tests/llapi/build-paclan.sh\n"
        },
        {
          "name": "Compile with unchanged clocks and strict timing acceptance",
          "run": "docker run --rm --network host --entrypoint /bin/bash -v \"$GITHUB_WORKSPACE:/jtcores\" -w /jtcores \"$BUILD_IMAGE\" -ec 'mkdir -p pilot-reports; quartus_sh --version | tee pilot-reports/quartus-version.txt; grep -Eq \"20\\.1\\.1.*Build 720.*Lite Edition\" pilot-reports/quartus-version.txt; bash /jtcores/tests/llapi/build-paclan.sh'"
        },
        {
          "name": "Verify menu and package paclan",
          "run": "python3 - <<'PYMENU'\nfrom pathlib import Path\ndata=bytes.fromhex(Path('cores/paclan/mister/cfgstr.hex').read_text())\nfor entry in [b'HCP3OO,Immediate Repoll,On,Off;',b'HCP3-,LLAPI Driver: 0.5.0;',b'-,Enhanced Core: 1.0;']:\n assert entry in data,entry\nassert b'TO CHANGE CONTROLLER' not in data\nassert b'CONTROLLER GUIDE' in data\nassert b'Autofire' in data or b'Auto Fire' in data\nPYMENU\nmkdir -p install/_Arcade/cores\ncp release/mister/jtpaclan.rbf install/_Arcade/cores/jtpaclan_llapi10.rbf\ncurl -fsSL --retry 3 'https://raw.githubusercontent.com/jotego/jtbin/7274a04840ba43ad529496b63bda9a18c491df68/mra/Pac-Land%20(World).mra' -o /tmp/paclan.mra\npython3 - <<'PYMRA'\nfrom pathlib import Path\nimport xml.etree.ElementTree as ET\np=Path('/tmp/paclan.mra').read_bytes()\nroot=ET.fromstring(p)\nassert root.findtext('rbf')=='jtpaclan'\nassert root.findtext('setname')=='pacland'\nassert root.find('buttons').get('names').split(',')[:3]==['Jump','-','-']\nPath('install/_Arcade/Pac-Land (World).mra').write_bytes(p.replace(b'<rbf>jtpaclan</rbf>', b'<rbf>jtpaclan_llapi10</rbf>'))\nPYMRA\n(cd install && sha256sum _Arcade/cores/*.rbf _Arcade/*.mra > SHA256SUMS)\n"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "Pac-Land-Enhanced-1.0",
            "path": "install/",
            "if-no-files-found": "error"
          }
        },
        {
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "Pac-Land-build-reports",
            "path": "pilot-reports/"
          }
        }
      ]
    }
  }
}

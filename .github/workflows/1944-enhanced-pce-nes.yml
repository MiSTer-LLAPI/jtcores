{
  "name": "1944 Enhanced PCE NES validation",
  "on": {
    "push": {
      "branches": [
        "enhanced-1944-pce-nes"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "enhanced-1944-pce-nes",
    "cancel-in-progress": false
  },
  "jobs": {
    "candidate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 240,
      "env": {
        "VARIANT": "candidate",
        "BUILD_IMAGE": "jotego/jtcore20@sha256:a0397645aeac483f90718c89e5fd491c4889db6e4202bcba7f7f7770e14beb6b"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "b222692d4c0c9a26a6cb3c99c6820b1ed4a5d565",
            "persist-credentials": false,
            "sparse-checkout": "cores/1944\ncores/cps1\ncores/cps15\ncores/cps2\nmodules/jtframe\nmodules/jteeprom\nmodules/fx68k\nmodules/jtdsp16\nmodules/jt12\ntests/llapi"
          }
        },
        {
          "name": "Fetch exact baseline submodules",
          "run": "git submodule update --init --recursive --depth 1 modules/fx68k modules/jtdsp16 modules/jt12"
        },
        {
          "name": "Apply verified Enhanced integration and record source",
          "run": "set -euo pipefail\npython3 - <<'PYCODE'\nfrom pathlib import Path\nimport base64,hashlib,subprocess\np=Path('/tmp/enhanced.patch')\np.write_bytes(base64.b64decode(''))\nassert hashlib.sha256(p.read_bytes()).hexdigest()=='0370678dbccb29dad7e8fd8b7bcf7ca3a6e24dda082d94f4220e7a6791661060'\nsubprocess.run(['git','apply','--check',str(p)],check=True)\nsubprocess.run(['git','apply',str(p)],check=True)\np=Path('tests/llapi/build-1944.sh');s=p.read_text();assert 'for seed in 1 2 3; do' in s;p.write_text(s.replace('for seed in 1 2 3; do','for seed in 1; do'))\nPYCODE\nmkdir -p comparison-provenance\ncp /tmp/enhanced.patch comparison-provenance/\ngit rev-parse HEAD > comparison-provenance/base-commit.txt\ngit diff --binary > comparison-provenance/tracked-patch.diff\nfind cores/1944 cores/cps1 modules/jtframe/target/mister tests/llapi -type f -print0 | sort -z | xargs -0 sha256sum > comparison-provenance/source-sha256.txt\nprintf '%s\\n' \"$BUILD_IMAGE\" > comparison-provenance/container.txt\n"
        },
        {
          "name": "Check controls and serial modes",
          "run": "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y iverilog\npython3 tests/llapi/run_pce_nes.py pilot-reports/controller-tests\n"
        },
        {
          "name": "Compile with unchanged clocks and strict timing acceptance",
          "run": "docker run --rm --network host --entrypoint /bin/bash -v \"$GITHUB_WORKSPACE:/jtcores\" -w /jtcores \"$BUILD_IMAGE\" /jtcores/tests/llapi/build-1944.sh"
        },
        {
          "name": "Preserve comparison reports and test artifacts",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "1944-enhanced-pce-nes-${{ github.run_id }}",
            "retention-days": 30,
            "path": "comparison-provenance/\npilot-build/\npilot-reports/\nlog/mister/\ncores/1944/mister/*.qsf\ncores/1944/mister/*.sdc\ncores/1944/mister/output_files/*.rpt\ncores/1944/mister/output_files/*.summary\n**/*.sdc\n**/*.qsf"
          }
        }
      ]
    }
  }
}

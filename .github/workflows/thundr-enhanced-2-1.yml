name: thundr Enhanced 2.1
on:
  push:
    branches: [test-thundr-enhanced-2-1]
    paths:
      - '.github/workflows/thundr-enhanced-2-1.yml'
      - '.github/thundr-enhanced2/**'
permissions:
  contents: read
concurrency:
  group: thundr-enhanced-2-1
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_IMAGE: jotego/jtcore20@sha256:a0397645aeac483f90718c89e5fd491c4889db6e4202bcba7f7f7770e14beb6b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: .github/thundr-enhanced2
      - name: Check out official thundr release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jotego/jtcores
          ref: 8bc8172993b9b9488cb45ee8a913090fc4d9b143
          path: jtcores
          persist-credentials: false
      - name: Verify official base and apply thundr integration
        working-directory: jtcores
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8bc8172993b9b9488cb45ee8a913090fc4d9b143
          git submodule update --init --recursive --depth 1 modules/jt51
          support="$GITHUB_WORKSPACE/.github/thundr-enhanced2"
          git apply --check "$support/enhanced-base.patch"
          git apply --whitespace=nowarn "$support/enhanced-base.patch"
          git apply --check "$support/autofire-profile.patch"
          git apply "$support/autofire-profile.patch"
          mkdir -p tests/llapi pilot-reports
          cp "$support/build-thundr.sh" "$support/check-thundr-timing.py" tests/llapi/
      - name: Verify official MRA profiles and simulate digital controllers
        run: |
          if ! command -v iverilog >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y iverilog
          fi
          support=.github/thundr-enhanced2
          hdl=jtcores/modules/jtframe/target/mister/hdl
          iverilog -g2012 -s tb -o /tmp/profile "$support/jtthundr_autofire_profile.sv" "$support/thundr-profile-tb.sv"
          vvp /tmp/profile
          iverilog -g2012 -DJTFRAME_THUNDR_AUTOFIRE -s tb -o /tmp/gesture "$hdl/jtframe_snac_turbo.sv" "$support/thundr-gesture-tb.sv"
          vvp /tmp/gesture
      - name: Compile thundr and verify all timing categories
        working-directory: jtcores
        run: |
          docker run --rm --network host --entrypoint /bin/bash -v "$PWD:/jtcores" -w /jtcores "$BUILD_IMAGE" -ec '
            quartus_sh --version | tee pilot-reports/quartus-version.txt
            grep -Eq "20\.1\.1.*Build 720.*Lite Edition" pilot-reports/quartus-version.txt
            bash tests/llapi/build-thundr.sh'
      - name: Verify generated menu and package seven digital variants
        run: |
          set -euo pipefail
          python3 - <<'PYMENU'
          from pathlib import Path
          menu = bytes.fromhex(Path("jtcores/cores/thundr/mister/cfgstr.hex").read_text()).replace(b"_", b" ")
          for entry in (b"Serial port,LLAPI 2P", b"Immediate Repoll: On", b"Show credits on pause,Off,On", b"CONTROLLER GUIDE", b"Hold action + Start x3"):
              assert entry in menu, entry
          PYMENU
          mkdir -p install/_Arcade/cores
          cp .github/thundr-enhanced2/mras/*.mra install/_Arcade/
          cp jtcores/release/mister/jtthundr.rbf install/_Arcade/cores/jtthundr_llapi21.rbf
          (cd install && find _Arcade -type f -exec sha256sum '{}' + > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: thundr-Enhanced-2.1
          path: install/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: thundr-Enhanced-2.1-reports
          path: jtcores/pilot-reports/
          if-no-files-found: warn

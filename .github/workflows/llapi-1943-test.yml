name: 1943 LLAPI and SNAC hold autofire
on:
  push:
    branches: [llapi-1943-test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 1943-llapi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
      - name: Apply 1944 hold-autofire to 1943 and preserve OSD pause
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = llapi-1943-test
          python3 - <<'PYCODE'
          from pathlib import Path
          assert '.osd_shown      ( OSD_STATUS      )' in Path('modules/jtframe/target/mister/hdl/jtframe_mister.sv').read_text()
          Path('modules/jtframe/target/mister/hdl/jtframe_llapi_arcade.sv').write_text('// SPDX-License-Identifier: GPL-3.0-or-later\n// Experimental JTFRAME bridge for the MiSTer-LLAPI arcade protocol.\n// Protocol implementation and arcade button IDs originate in\n// MiSTer-LLAPI/Arcade-IremM62_MiSTer, commit 4d637039.\nmodule jtframe_llapi_arcade #(\n    parameter BUTTONS=3\n)(\n    input clk_50, clk_sys, rst, vblank, osd_active, enable,\n    input [6:0] user_in,\n    output logic [6:0] user_out,\n    input [15:0] usb1, usb2,\n    output [15:0] joy1, joy2,\n    output [3:0] start, coin,\n    output osd_request,\n    output [1:0] autofire_hold\n);\n    wire [31:0] buttons1, buttons2;\n    wire [7:0] type1,type2;\n    wire en1,en2,latch1,data1,latch2,data2;\n    (* async_reg="true" *) reg rst50_meta=1, rst50_sync=1;\n    (* async_reg="true" *) reg osd50_meta=0, osd50_sync=0;\n    reg seen1=0,seen2=0;\n    wire valid1=enable && en1 && type1!=8\'hff && (type1!=0 || seen1);\n    wire valid2=enable && en2 && type2!=8\'hff && (type2!=0 || seen2);\n    always @(posedge clk_50) begin\n        rst50_meta<=rst; rst50_sync<=rst50_meta;\n        osd50_meta<=osd_active; osd50_sync<=osd50_meta;\n        if(rst50_sync) begin seen1<=0; seen2<=0; end\n        else begin\n            if(en1 && type1!=8\'hff && |buttons1) seen1<=1;\n            if(en2 && type2!=8\'hff && |buttons2) seen2<=1;\n        end\n    end\n    // Same physical USER port wiring and enable polarity as the arcade cores.\n    always_comb begin\n        user_out=7\'h7f;\n        user_out[0]=latch1; user_out[1]=data1;\n        user_out[2]=osd50_sync;\n        user_out[4]=latch2; user_out[5]=data2;\n    end\n    LLAPI u_port1(.CLK_50M(clk_50),.LLAPI_SYNC(vblank),\n        .IO_LATCH_IN(user_in[0]),.IO_LATCH_OUT(latch1),\n        .IO_DATA_IN(user_in[1]),.IO_DATA_OUT(data1),.ENABLE(enable && ~osd50_sync),\n        .LLAPI_BUTTONS(buttons1),.LLAPI_ANALOG(),.LLAPI_TYPE(type1),\n        .LLAPI_MODES(),.LLAPI_EN(en1));\n    LLAPI u_port2(.CLK_50M(clk_50),.LLAPI_SYNC(vblank),\n        .IO_LATCH_IN(user_in[4]),.IO_LATCH_OUT(latch2),\n        .IO_DATA_IN(user_in[5]),.IO_DATA_OUT(data2),.ENABLE(enable && ~osd50_sync),\n        .LLAPI_BUTTONS(buttons2),.LLAPI_ANALOG(),.LLAPI_TYPE(type2),\n        .LLAPI_MODES(),.LLAPI_EN(en2));\n    // Button levels are slow asynchronous inputs, not a streamed data bus.\n    // Constrain only the first sampling stages; retain timing between stages.\n    (* async_reg="true" *) reg [31:0] buttons1_meta=0,buttons1_sync=0;\n    (* async_reg="true" *) reg [31:0] buttons2_meta=0,buttons2_sync=0;\n    (* async_reg="true" *) reg valid1_meta=0,valid1_sync=0;\n    (* async_reg="true" *) reg valid2_meta=0,valid2_sync=0;\n    always @(posedge clk_sys) begin\n        if(rst) begin\n            buttons1_meta<=0; buttons1_sync<=0;\n            buttons2_meta<=0; buttons2_sync<=0;\n            valid1_meta<=0; valid1_sync<=0;\n            valid2_meta<=0; valid2_sync<=0;\n        end else begin\n            buttons1_meta<=buttons1; buttons1_sync<=buttons1_meta;\n            buttons2_meta<=buttons2; buttons2_sync<=buttons2_meta;\n            valid1_meta<=valid1; valid1_sync<=valid1_meta;\n            valid2_meta<=valid2; valid2_sync<=valid2_meta;\n        end\n    end\n`ifdef JTFRAME_LLAPI_HOLD_AUTOFIRE\n    // SNES LLAPI X is button bit 2; reserved for hold-to-fire in builds that enable it.\n    assign autofire_hold={valid2_sync && buttons2_sync[2],valid1_sync && buttons1_sync[2]};\n`else\n    assign autofire_hold=0;\n`endif\n`ifdef JTFRAME_LLAPI_HOLD_AUTOFIRE\n    // X is reserved for autofire; do not also invoke 1943\'s button-3 loop.\n    wire [31:0] mapped1=buttons1_sync & 32\'hfffffffb;\n    wire [31:0] mapped2=buttons2_sync & 32\'hfffffffb;\n`else\n    wire [31:0] mapped1=buttons1_sync,mapped2=buttons2_sync;\n`endif\n    jtframe_llapi_arcade_map #(.BUTTONS(BUTTONS)) u_map(\n        .buttons1(mapped1),.buttons2(mapped2),\n        .valid1(valid1_sync),.valid2(valid2_sync),.osd_active(osd_active),\n        .usb1(usb1),.usb2(usb2),.joy1(joy1),.joy2(joy2),\n        .start(start),.coin(coin),.osd_request(osd_request));\nendmodule\n\nmodule jtframe_llapi_arcade_map #(parameter BUTTONS=3)(\n    input [31:0] buttons1,buttons2,\n    input valid1,valid2,osd_active,\n    input [15:0] usb1,usb2,\n    output [15:0] joy1,joy2,\n    output [3:0] start,coin,\n    output osd_request\n);\n    wire [31:0] p1=valid1 ? buttons1 : 32\'d0;\n    wire [31:0] p2=valid2 ? buttons2 : 32\'d0;\n    assign osd_request=(p1[26]&p1[5]&p1[0]) | (p2[26]&p2[5]&p2[0]);\n    wire inhibit=osd_active | osd_request;\n    function automatic [15:0] game_buttons(input [31:0] p);\n        integer n;\n        begin\n            game_buttons=0;\n            game_buttons[3:0]=p[27:24]; // up, down, left, right\n            for(n=0;n<3;n=n+1)\n                if(n<BUTTONS) game_buttons[4+n]=p[n];\n        end\n    endfunction\n    // Preserve the existing arcade allocation: one LLAPI socket reserves\n    // its player slot; USB player 1 fills the other slot.\n    assign joy1=valid1 ? (inhibit ? 16\'d0 : game_buttons(p1)) : usb1;\n    assign joy2=valid2 ? (inhibit ? 16\'d0 : game_buttons(p2)) :\n                         (valid1 ? usb1 : usb2);\n    // Arcade convention: button 5 starts P1 and button 6 starts P2,\n    // from either socket. Button 4 is that socket\'s coin input.\n    assign start=inhibit ? 4\'d0 : {2\'b0,p1[6]|p2[6],p1[5]|p2[5]};\n    assign coin=inhibit ? 4\'d0 : {2\'b0,p2[4],p1[4]};\nendmodule\n\n')
          Path('modules/jtframe/target/mister/hdl/jtframe_serial_arcade.sv').write_text('// SPDX-License-Identifier: GPL-3.0-or-later\n// Optional digital SNAC readers for the 1943 LLAPI pilot.\n// USER pin assignments follow MiSTer-devel SNES, Genesis and Saturn cores.\n// Saturn nibble order also checked against Timothy Redaelli\'s joydb9saturn\n// reader in MiSTer-DB9/jtcores; this is a single-port SNAC implementation.\nmodule jtframe_serial_arcade #(parameter BUTTONS=3)(\n    input clk_50,clk_sys,rst,vblank,osd_active,\n    input [2:0] mode, // 0 LLAPI, 1 Saturn, 2 SEGA, 3 original DB15, 4 SNES\n    input [6:0] user_in,\n    output [6:0] user_out,\n    input [15:0] usb1,usb2,\n    output [15:0] joy1,joy2,\n    output [3:0] start,coin,\n    output db15_drive,\n    output osd_request\n);\n    (* async_reg="true" *) reg [2:0] mode_meta=0,mode50=0;\n    reg [2:0] previous_mode=0;\n    reg [12:0] settle=7500;\n    wire ready50=(settle==0) && mode50==previous_mode;\n    always @(posedge clk_50) begin\n        mode_meta<=mode; mode50<=mode_meta;\n        previous_mode<=mode50;\n        if(mode50!=previous_mode) settle<=13\'d7500; // 150 us released\n        else if(settle!=0) settle<=settle-1\'b1;\n    end\n    wire [6:0] llapi_out,snac_out;\n    wire [15:0] llapi_joy1,llapi_joy2;\n    wire [3:0] llapi_start,llapi_coin;\n    wire llapi_osd;\n    wire [1:0] llapi_af,snac_af;\n    jtframe_llapi_arcade #(.BUTTONS(BUTTONS)) u_llapi(\n        .clk_50(clk_50),.clk_sys(clk_sys),.rst(rst),.vblank(vblank),\n        .enable(ready50 && mode50==0),.osd_active(osd_active),\n        .user_in(user_in),.user_out(llapi_out),.usb1(usb1),.usb2(usb2),\n        .joy1(llapi_joy1),.joy2(llapi_joy2),.start(llapi_start),\n        .coin(llapi_coin),.osd_request(llapi_osd),.autofire_hold(llapi_af));\n    wire [8:0] snac_pad,snac_pad2;\n    wire [1:0] reader_mode=mode50==1 ? 3 : mode50==2 ? 2 : mode50==4 ? 1 : 0;\n    jtframe_snac_arcade u_snac(.clk_50(clk_50),\n        .enable(ready50 && reader_mode!=0),.mode(reader_mode),\n        .user_in(user_in),.user_out(snac_out),.pad(snac_pad),.pad2(snac_pad2),.autofire_hold(snac_af));\n    // Only one mux drives the physical connector. Inactive readers cannot\n    // drive pins, and all pins are released while changing protocol.\n    assign db15_drive=ready50 && mode50==3;\n    wire db_clk,db_load;\n    wire [15:0] db1,db2;\n    // Preserve Jotego\'s original Antonio Villena DB15 splitter reader.\n    joy_db15 u_db15(.clk(clk_50),.JOY_CLK(db_clk),.JOY_LOAD(db_load),\n        .JOY_DATA(user_in[5]),.joystick1(db1),.joystick2(db2));\n    wire [8:0] port1=mode50==3 ? {db1[11:10],db1[6:0]} : snac_pad;\n    wire [8:0] port2=mode50==3 ? {db2[11:10],db2[6:0]} : mode50==4 ? snac_pad2 : 9\'d0;\n    assign user_out=!ready50 ? 7\'h7f : mode50==0 ? llapi_out :\n                    mode50==3 ? {5\'h1f,db_clk,db_load} : snac_out;\n    (* async_reg="true" *) reg [8:0] pad_meta=0,pad_sys=0,pad2_meta=0,pad2_sys=0;\n    (* async_reg="true" *) reg [2:0] active_meta=0,active_sys=0;\n    (* async_reg="true" *) reg ready_meta=0,ready_sys=0;\n    always @(posedge clk_sys) begin\n        pad_meta<=port1; pad_sys<=pad_meta;\n        pad2_meta<=port2; pad2_sys<=pad2_meta;\n        active_meta<=mode50; active_sys<=active_meta;\n        ready_meta<=ready50; ready_sys<=ready_meta;\n    end\n    wire stable=ready_sys && active_sys==mode;\n    wire snac_selected=stable && active_sys!=0 && active_sys<=4;\n    wire db15_selected=stable && active_sys==3;\n    wire dual_snac=stable && (active_sys==3 || active_sys==4);\n    wire snac_menu=snac_selected && (db15_selected ?\n        ((pad_sys[7] && pad_sys[6]) || (pad2_sys[7] && pad2_sys[6])) :\n        ((pad_sys[2] && pad_sys[7] && pad_sys[4]) ||\n         (active_sys==4 && pad2_sys[2] && pad2_sys[7] && pad2_sys[4])));\n    wire inhibit=osd_active || snac_menu;\n    wire [15:0] raw_joy1,raw_joy2;\n    assign raw_joy1=!stable ? usb1 : !snac_selected ? llapi_joy1 :\n                 inhibit ? 16\'d0 : {9\'d0,pad_sys[6:0]};\n    assign raw_joy2=!stable ? usb2 : dual_snac ?\n                 (inhibit ? 16\'d0 : {9\'d0,pad2_sys[6:0]}) :\n                 snac_selected ? usb1 : llapi_joy2;\n`ifdef JTFRAME_LLAPI_HOLD_AUTOFIRE\n    (* async_reg="true" *) reg [1:0] snac_af_meta=0,snac_af_sys=0;\n    (* async_reg="true" *) reg vb_meta=0,vb_sync=0;\n    always @(posedge clk_sys) begin\n        snac_af_meta<=snac_af;snac_af_sys<=snac_af_meta;\n        vb_meta<=vblank;vb_sync<=vb_meta;\n    end\n    wire [1:0] held=stable && !inhibit ?\n        (active_sys==0 ? llapi_af : active_sys==4 ? snac_af_sys : 2\'b0) : 2\'b0;\n    wire fire1,fire2;\n    hold_autofire af1(clk_sys,rst,vb_sync,held[0],raw_joy1[4],inhibit,fire1);\n    hold_autofire af2(clk_sys,rst,vb_sync,held[1],raw_joy2[4],inhibit,fire2);\n    assign joy1={raw_joy1[15:5],fire1,raw_joy1[3:0]};\n    assign joy2={raw_joy2[15:5],fire2,raw_joy2[3:0]};\n`else\n    assign joy1=raw_joy1;assign joy2=raw_joy2;\n`endif\n    assign start=!stable ? 4\'d0 : !snac_selected ? llapi_start :\n                 {2\'d0,dual_snac && pad2_sys[7] && !inhibit,\n                  pad_sys[7] && (!pad_sys[8] || db15_selected) && !inhibit};\n    assign coin=!stable ? 4\'d0 : !snac_selected ? llapi_coin :\n                 {2\'d0,dual_snac && pad2_sys[8] && !inhibit,pad_sys[8] && !inhibit};\n    assign osd_request=stable && (snac_selected ? snac_menu : llapi_osd);\nendmodule\n\nmodule jtframe_snac_arcade #(\n    parameter TICK_CYCLES=500, // 10 us at 50 MHz; shortened only in simulation\n    parameter SCAN_TICKS=250  // 2.5 ms; allows MD six-button timeout to reset\n)(\n    input clk_50,enable,\n    input [1:0] mode, // 1 SNES, 2 Mega Drive, 3 Saturn digital\n    input [6:0] user_in,\n    output reg [6:0] user_out=7\'h7f,\n    // [8] coin, [7] start, [6:4] buttons, [3:0] UDLR, active high\n    output reg [1:0] autofire_hold=0,\n    output reg [8:0] pad=0,pad2=0\n);\n    (* async_reg="true" *) reg [6:0] input_meta=7\'h7f,input_sync=7\'h7f;\n    always @(posedge clk_50) begin input_meta<=user_in; input_sync<=input_meta; end\n    reg [15:0] ticks=0;\n    reg [8:0] phase=0;\n    reg [2:0] old_mode=0;\n    reg [15:0] snes=16\'hffff,snes2=16\'hffff;\n    reg [5:0] md_high=6\'h3f;\n    reg [1:0] md_as=2\'b11;\n    reg md_valid=0,md_six=0;\n    reg [3:0] md_extra=4\'hf;\n    reg [3:0] sat_extra=4\'hf,sat_main=4\'hf,sat_dir=4\'hf;\n    wire [5:0] md_in={input_sync[6],input_sync[2],input_sync[3],input_sync[5],input_sync[0],input_sync[1]}; // C B R L D U\n    wire [3:0] sat_in={input_sync[3],input_sync[5],input_sync[0],input_sync[1]}; // D3..D0\n    always @(posedge clk_50) begin\n        old_mode<={1\'b0,mode};\n        if(!enable || mode==0 || {1\'b0,mode}!=old_mode) begin\n            autofire_hold<=0; ticks<=0; phase<=0; user_out<=7\'h7f; pad<=0; pad2<=0;\n            snes<=16\'hffff; snes2<=16\'hffff; md_valid<=0; md_six<=0;\n            md_high<=6\'h3f; md_as<=2\'b11; md_extra<=4\'hf;\n            sat_extra<=4\'hf; sat_main<=4\'hf; sat_dir<=4\'hf;\n        end else if(ticks==TICK_CYCLES-1) begin\n            ticks<=0;\n            phase<=phase==SCAN_TICKS-1 ? 0 : phase+1\'b1;\n            case(mode)\n                1: begin\n                    // Official SNES dual-port SNAC: shared latch USER0,\n                    // P1 clock/data USER1/5, P2 clock/data USER3/6.\n                    // Sample before each falling edge; controller advances\n                    // on that edge, leaving a full period for the next bit.\n                    if(phase==0 || phase==1) begin user_out<=7\'h7f; snes<=16\'hffff; snes2<=16\'hffff; end\n                    if(phase==2) user_out[0]<=0;\n                    if(phase>=3 && phase<=33 && phase[0]) begin\n                        snes[(phase-3)>>1]<=input_sync[5];\n                        snes2[(phase-3)>>1]<=input_sync[6];\n                        user_out[1]<=0; user_out[3]<=0;\n                    end\n                    if(phase>=4 && phase<=34 && !phase[0]) begin user_out[1]<=1; user_out[3]<=1; end\n                    if(phase==35) begin\n                        autofire_hold<={(snes2[15:12]==4\'hf)&&!snes2[9],(snes[15:12]==4\'hf)&&!snes[9]};\n                        if(snes[15:12]==4\'hf)\n                            pad<={~snes[2],~snes[3],~snes[1],~snes[8],~snes[0],~snes[4],~snes[5],~snes[6],~snes[7]};\n                        else pad<=0;\n                        if(snes2[15:12]==4\'hf)\n                            pad2<={~snes2[2],~snes2[3],~snes2[1],~snes2[8],~snes2[0],~snes2[4],~snes2[5],~snes2[6],~snes2[7]};\n                        else pad2<=0;\n                    end\n                end\n                2: begin\n                    // Mega Drive: TH=USER4. Other pins remain released inputs.\n                    case(phase)\n                        0: begin user_out<=7\'h6f; md_six<=0; md_extra<=4\'hf; end\n                        1: user_out[4]<=1;\n                        2: begin md_high<=md_in; user_out[4]<=0; end\n                        3: begin md_as<=md_in[5:4]; md_valid<=(md_in[3:2]==0); user_out[4]<=1; end\n                        4: user_out[4]<=0;\n                        5: begin md_six<=(md_in[3:0]==0); user_out[4]<=1; end\n                        6: begin md_extra<=md_in[3:0]; user_out[4]<=0; end\n                        7: begin\n                            user_out[4]<=1;\n                            if(md_valid) begin\n                                pad[3:0]<=~{md_high[0],md_high[1],md_high[2],md_high[3]};\n                                pad[6:4]<=~{md_high[5],md_as[0],md_high[4]}; // C,A,B => buttons 3,2,1\n                                pad[7]<=~md_as[1];\n                                // Mode on a 6-button pad; Down+Start also\n                                // works on a 3-button pad (consumes Start).\n                                pad[8]<=(md_six && !md_extra[3]) || (!md_high[1] && !md_as[1]);\n                            end else pad<=0;\n                        end\n                    endcase\n                end\n                3: begin\n                    // Saturn digital: TH=USER4, TR=USER6; D3..0 use\n                    // USER3,5,0,1. TL/USER2 is released (input).\n                    case(phase)\n                        0: user_out<=7\'h2f; // TH=0, TR=0\n                        1: begin sat_extra<=sat_in; user_out[4]<=1; end\n                        2: begin sat_main<=sat_in; user_out[4]<=0; user_out[6]<=1; end\n                        3: begin sat_dir<=sat_in; user_out[4]<=1; end\n                        4: begin\n                            // Digital pad ID: final phase is {L,1,0,0}.\n                            // Reject an analog-handshake pad instead of\n                            // retaining stale data or inventing button presses.\n                            if(sat_in[2:0]==3\'b100) begin\n                                pad[3:0]<=~{sat_dir[0],sat_dir[1],sat_dir[2],sat_dir[3]};\n                                pad[6:4]<=~{sat_main[2],sat_main[1],sat_main[0]}; // A,C,B\n                                pad[7]<=~sat_main[3];\n                                pad[8]<=~sat_in[3]; // L inserts coin\n                            end else pad<=0;\n                        end\n                    endcase\n                end\n            endcase\n        end else ticks<=ticks+1\'b1;\n    end\nendmodule\n\n\n`ifdef JTFRAME_LLAPI_HOLD_AUTOFIRE\n// SPDX-License-Identifier: GPL-3.0-or-later\n// Frame-based hold-to-fire pulse generator; map the physical button upstream.\nmodule hold_autofire #(parameter HALF_PERIOD_FRAMES=3)(\n input clk,rst,frame,hold_button,manual_fire,inhibit,\n output fire\n);\nlocalparam CW=HALF_PERIOD_FRAMES<2 ? 1 : $clog2(HALF_PERIOD_FRAMES);\nreg [CW-1:0] count=0;\nreg phase=1,previous_frame=0;\nalways @(posedge clk) begin\n previous_frame<=frame;\n if(rst || inhibit || !hold_button) begin count<=0;phase<=1;end\n else if(frame && !previous_frame) begin\n  if(count==HALF_PERIOD_FRAMES-1) begin count<=0;phase<=~phase;end\n  else count<=count+1\'b1;\n end\nend\nassign fire=!rst && !inhibit && (manual_fire || (hold_button && phase));\nendmodule\n\n`endif\n')
          Path('tests/llapi/hold_autofire.sv').write_text("// SPDX-License-Identifier: GPL-3.0-or-later\n// Frame-based hold-to-fire pulse generator; map the physical button upstream.\nmodule hold_autofire #(parameter HALF_PERIOD_FRAMES=3)(\n input clk,rst,frame,hold_button,manual_fire,inhibit,\n output fire\n);\nlocalparam CW=HALF_PERIOD_FRAMES<2 ? 1 : $clog2(HALF_PERIOD_FRAMES);\nreg [CW-1:0] count=0;\nreg phase=1,previous_frame=0;\nalways @(posedge clk) begin\n previous_frame<=frame;\n if(rst || inhibit || !hold_button) begin count<=0;phase<=1;end\n else if(frame && !previous_frame) begin\n  if(count==HALF_PERIOD_FRAMES-1) begin count<=0;phase<=~phase;end\n  else count<=count+1'b1;\n end\nend\nassign fire=!rst && !inhibit && (manual_fire || (hold_button && phase));\nendmodule\n")
          Path('tests/llapi/hold_autofire_tb.sv').write_text('`timescale 1ns/1ps\nmodule hold_autofire_tb;\nreg clk=0,rst=1,frame=0,a=0,b=0,manual=0,inhibit=0;\nwire fa,fb;\nalways #5 clk=~clk;\nhold_autofire p1(clk,rst,frame,a,manual,inhibit,fa);\nhold_autofire p2(clk,rst,frame,b,1\'b0,inhibit,fb);\ntask tick;begin @(negedge clk);end endtask\ntask nextframe;begin frame=1;repeat(4)tick();frame=0;repeat(4)tick();end endtask\ninitial begin\n repeat(3)tick();rst=0;tick();\n if(fa||fb)$fatal(1,"idle");\n a=1;tick();if(!fa||fb)$fatal(1,"immediate fire and independent P2");\n nextframe();nextframe();if(!fa)$fatal(1,"on duration");\n nextframe();if(fa)$fatal(1,"off phase");\n b=1;tick();if(!fb||fa)$fatal(1,"independent hold phase");\n manual=1;tick();if(!fa)$fatal(1,"manual shot priority");\n manual=0;a=0;tick();if(fa)$fatal(1,"release stops immediately");\n inhibit=1;tick();if(fa||fb)$fatal(1,"OSD inhibition");\n inhibit=0;tick();if(!fb)$fatal(1,"resume clean phase");\n rst=1;tick();if(fa||fb)$fatal(1,"reset releases inputs");\n $display("PASS hold/release, frame rate, independent players, manual shot, OSD and reset");$finish;\nend\nendmodule\n')
          Path('tests/llapi/build-1943.sh').write_text('#!/usr/bin/env bash\nset -euo pipefail\n# Run inside Jotego\'s public jtcore20 build container, with this repo at /jtcores.\ncd /jtcores\n# The container runs as root; trust only this mounted source checkout.\ngit config --global --add safe.directory /jtcores\nexport JTROOT=/jtcores\nexport JTFRAME=$JTROOT/modules/jtframe\nexport MODULES=$JTROOT/modules\nexport CORES=$JTROOT/cores\nexport JTBIN=$JTROOT/release\nexport RLS=$JTBIN\nexport MRA=$JTBIN/mra\nexport ROM=$JTROOT/rom\nexport POCKET=$JTFRAME/target/pocket\nexport JTUTIL=/tmp/llapi-support\nexport PATH=/tmp/llapi-tools:$JTFRAME/bin:/usr/local/go/bin:$PATH\nmkdir -p /tmp/llapi-tools "$JTUTIL" "$JTBIN" pilot-reports\n# Set only build variables; do not source scripts that override CODEX_HOME.\n(cd "$JTFRAME/src/jtframe" && go build -o /tmp/llapi-tools/jtframe .)\n# Decode no game ROMs and use the official Euro MRA supplied with this pilot.\n# Strict JTFRAME timing acceptance stays enabled for all attempts.\nsuccess=0\nfor seed in 1 2 3; do\n    if jtcore 1943 -mister --nodbg --nolinter --clean --seed "$seed" > "pilot-reports/seed-$seed.log" 2>&1; then\n        success=1\n        printf \'%s\\n\' "$seed" > pilot-reports/accepted-seed.txt\n        break\n    fi\n    cp -f log/mister/jt1943* pilot-reports/ 2>/dev/null || true\n    if ! grep -q \'^FAIL$\' "pilot-reports/seed-$seed.log"; then\n        tail -100 "pilot-reports/seed-$seed.log"\n        exit 1\n    fi\ndone\nif test "$success" != 1; then\n    echo \'No seed passed compilation and strict timing acceptance.\'\n    exit 1\nfi\npython3 tests/llapi/check-timing.py\nmkdir -p pilot-build/cores pilot-build/mra pilot-build/reports\ncp release/mister/jt1943.rbf pilot-build/cores/jt1943_llapi_snac_20261030_autofire.rbf\ncp tests/llapi/1943-LLAPI-SNAC-Test.mra pilot-build/mra/\ncp tests/llapi/README.md pilot-build/LE-ME.md\ncp pilot-reports/* pilot-build/reports/\ncp cores/1943/mister/output_files/*.summary pilot-build/reports/ 2>/dev/null || true\ncp cores/1943/mister/output_files/*.sta.rpt pilot-build/reports/ 2>/dev/null || true\nprintf \'Source: %s\\nUpstream: b222692d4c0c9a26a6cb3c99c6820b1ed4a5d565\\nArcade LLAPI: 4d63703988cfb2b8256fc3bdb1a4a09b39cceaba\\n\' "$(git rev-parse HEAD)" > pilot-build/SOURCE.txt\n(cd pilot-build && sha256sum cores/*.rbf mra/*.mra > SHA256SUMS)\n')
          Path('tests/llapi/README.md').write_text("# 1943 LLAPI + SNAC — hold autofire experimental\n\nHold X on a SNES controller via LLAPI or SNAC SNES for autofire; release X to stop. This is not a toggle. The pulse timing is the same as the hardware-tested 1944 autofire implementation (three frames per half-period, about 10 shots per second). X is reserved for autofire and does not activate the 1943 third-button loop shortcut through LLAPI. Manual firing, bomb and menu shortcuts remain available. Other controller modes keep their previous mappings.\n\nLLAPI 2P is the default. Serial modes: LLAPI 2P; SNAC SATURN 1P; SNAC DB9 1P (Mega Drive 3/6-button); SNAC DB15 2P (Ultimate SNAC DB15); SNAC SNES 2P with a compatible dual-port adapter. Saturn is digital only; no Bliss-Box cable profile, analog 3D handshake or multitap. Keep DE10-Nano SW1 OFF.\n\nThe game pauses while OSD is open and resumes when it closes, preserving manual pause. The original upstream 1943 credits page is static by design. All controller modes and OSD pause were physically confirmed by UltimateMiSTer in preceding 1943 builds. UltimateMiSTer physically confirmed the same hold-autofire feature on 1944. This new 1943 autofire build still requires physical validation; successful automated tests and timing checks do not establish hardware validation of this revision.\n\nSNES: B shoots, A bombs, X held autofires, Select inserts that player's coin, Start starts that player, Down+Start+B opens OSD. SNES dual-port wiring: shared latch USER0; P1 clock/data USER1/USER5, P2 USER3/USER6. DB15 retains Jotego's original reader and pinout; Select/Start per player, Start+C opens OSD. Mega Drive: Mode (6-button) or Down+Start inserts a coin, release then Start alone starts P1. Keyboard 5 inserts P1 coin; F5 lowers volume.\n\nInstall the matching MRA and RBF together, in _Arcade/ and _Arcade/cores/. The LLAPI Update All entry is _LLAPI/_Arcade/1943-LLAPI-Test.mra once its catalogue update is verified. Supply your own compatible Euro 1943.zip. No ROM data is included.\n\nIndependent experimental MiSTer-LLAPI integration of Jotego's core. Original credits, licenses, LLAPI notices and source history are preserved. Please support https://patreon.com/jotego.\n")
          Path('tests/llapi/hold_1943_tb.sv').write_text('`timescale 1ns/1ps\nmodule hold_1943_tb;\nreg clk=0,rst=1,frame=0,osd=0;always #5 clk=~clk;\nwire [15:0] j1,j2;wire [6:0] uo;wire [3:0] st,co;wire db,menu;\njtframe_serial_arcade #(.BUTTONS(3)) dut(.clk_50(clk),.clk_sys(clk),.rst(rst),.vblank(frame),.osd_active(osd),.mode(3\'d0),.user_in(7\'h7f),.user_out(uo),.usb1(16\'d0),.usb2(16\'d0),.joy1(j1),.joy2(j2),.start(st),.coin(co),.db15_drive(db),.osd_request(menu));\ntask settle;begin repeat(12)@(negedge clk);end endtask\ntask nextframe;begin frame=1;settle();frame=0;settle();end endtask\ninitial begin\n settle();rst=0;repeat(8000)@(negedge clk);\n force dut.u_llapi.valid1_sync=1;force dut.u_llapi.valid2_sync=1;\n force dut.u_llapi.buttons1_sync=32\'h00000004;force dut.u_llapi.buttons2_sync=0;\n settle();if(!j1[4]||j1[6]||j1[5]||j2)$fatal(1,"X must autofire P1 without loop/bomb/P2");\n nextframe();nextframe();nextframe();if(j1[4]||j1[6])$fatal(1,"X off phase");\n force dut.u_llapi.buttons1_sync=32\'h00000005;settle();if(!j1[4]||j1[6])$fatal(1,"manual shot overrides off phase without loop");\n force dut.u_llapi.buttons1_sync=0;force dut.u_llapi.buttons2_sync=4;\n settle();if(j1||!j2[4]||j2[6]||j2[5])$fatal(1,"P2 independent autofire without loop/bomb");\n osd=1;settle();if(j1||j2)$fatal(1,"OSD suppresses autofire");\n osd=0;force dut.u_llapi.buttons2_sync=0;settle();if(j1||j2)$fatal(1,"release stops");\n force dut.u_llapi.buttons1_sync=2;settle();if(!j1[5]||j1[4]||j1[6])$fatal(1,"bomb retained");\n $display("PASS 1943 BUTTONS=3: held X fires without loop/bomb, release, P2 independence, manual shot, OSD and bomb preserved");$finish;\nend\nendmodule\n')
          p=Path('cores/1943/cfg/macros.def'); s=p.read_text()
          if 'JTFRAME_LLAPI_HOLD_AUTOFIRE' not in s: p.write_text(s+'\nJTFRAME_LLAPI_HOLD_AUTOFIRE\n')
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/jtframe/target/mister/hdl/jtframe_llapi_arcade.sv modules/jtframe/target/mister/hdl/jtframe_serial_arcade.sv tests/llapi cores/1943/cfg/macros.def
          if ! git diff --cached --quiet; then
            git commit -m 'Add hold-X autofire for 1943 LLAPI and SNAC SNES; preserve manual controls and OSD pause'
            git push origin HEAD:refs/heads/llapi-1943-test
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  controllers:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            tests/llapi
            modules/jtframe/target/mister/hdl
            modules/jtframe/hdl
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Test arcade mapping and protocol compilation
        run: |
          iverilog -g2012 -s arcade_map_tb -o /tmp/llapi-map tests/llapi/arcade_map_tb.sv modules/jtframe/target/mister/hdl/jtframe_llapi_arcade.sv
          vvp /tmp/llapi-map
          iverilog -g2012 -s snac_readers_tb -o /tmp/snac-readers tests/llapi/snac_readers_tb.sv modules/jtframe/target/mister/hdl/jtframe_serial_arcade.sv
          vvp /tmp/snac-readers
          iverilog -g2012 -DJTFRAME_LLAPI_HOLD_AUTOFIRE -s serial_modes_tb -o /tmp/serial-modes tests/llapi/serial_modes_tb.sv modules/jtframe/target/mister/hdl/jtframe_serial_arcade.sv modules/jtframe/target/mister/hdl/jtframe_llapi_arcade.sv modules/jtframe/target/mister/hdl/jtframe_llapi_protocol.sv modules/jtframe/target/mister/hdl/joydb15.v
          vvp /tmp/serial-modes
          iverilog -g2012 -s db15_reader_tb -o /tmp/db15 tests/llapi/db15_reader_tb.sv modules/jtframe/target/mister/hdl/jtframe_serial_arcade.sv modules/jtframe/target/mister/hdl/jtframe_llapi_arcade.sv modules/jtframe/target/mister/hdl/jtframe_llapi_protocol.sv modules/jtframe/target/mister/hdl/joydb15.v
          vvp /tmp/db15
          iverilog -g2012 -s hold_autofire_tb -o /tmp/hold-af tests/llapi/hold_autofire.sv tests/llapi/hold_autofire_tb.sv
          vvp /tmp/hold-af
          iverilog -g2012 -DJTFRAME_LLAPI_HOLD_AUTOFIRE -s hold_1943_tb -o /tmp/hold193 tests/llapi/hold_1943_tb.sv modules/jtframe/target/mister/hdl/jtframe_serial_arcade.sv modules/jtframe/target/mister/hdl/jtframe_llapi_arcade.sv modules/jtframe/target/mister/hdl/jtframe_llapi_protocol.sv modules/jtframe/target/mister/hdl/joydb15.v
          vvp /tmp/hold193
          python3 - <<'PYCODE'
          from pathlib import Path
          s=Path('modules/jtframe/target/mister/hdl/jtframe_mister.sv').read_text()
          assert '.osd_shown      ( OSD_STATUS      )' in s
          PYCODE
          iverilog -g2012 -DMISTER -s osd_pause_tb -o /tmp/osd-pause tests/llapi/osd_pause_tb.sv modules/jtframe/hdl/jtframe_dip.v modules/jtframe/hdl/keyboard/jtframe_pause.v modules/jtframe/hdl/jtframe_toggle.v
          vvp /tmp/osd-pause
  build:
    needs: [source, controllers]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            cores/1943
            cores/gng
            cores/trojan
            modules/jtframe
            modules/jt8051
            modules/jt12
            tests/llapi
      - name: Fetch the public sound dependency at its pinned commit
        run: git submodule update --init --recursive --depth 1 modules/jt12
      - name: Compile 1943 with the official Jotego build container
        run: |
          set -euo pipefail
          docker run --rm --network host --entrypoint /bin/bash -v "$GITHUB_WORKSPACE:/jtcores" -w /jtcores jotego/jtcore20 /jtcores/tests/llapi/build-1943.sh
      - name: Upload accepted test RBF and build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 1943-LLAPI-pilot-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            pilot-build/
            pilot-reports/
            log/mister/
            cores/1943/mister/output_files/*.summary
            cores/1943/mister/output_files/*.sta.rpt
            cores/1943/mister/output_files/*.map.rpt
            cores/1943/mister/*.qsf
            cores/1943/mister/*.qip
  publish:
    needs: [source, controllers, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: 1943-LLAPI-pilot-${{ github.run_number }}
          path: built
      - name: Publish experimental 1943 autofire only after tests and timing pass
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json,os,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('built/pilot-build')
          d=json.loads((p/'reports/timing-acceptance.json').read_text())
          assert d['accepted'] and all(v>=0 for v in d['worst_slack_ns'].values())
          m=ET.parse(p/'mra/1943-LLAPI-SNAC-Test.mra')
          assert m.findtext('rbf')=='jt1943_llapi_snac'
          m.find('rbf').text='jt1943_llapi_snac_20261030_autofire'
          m.write(p/'mra/1943-LLAPI-SNAC-Test.mra',encoding='utf-8',xml_declaration=True)
          notes=p/'LE-ME.md'
          notes.write_text(notes.read_text()+'\nExact compiled source: '+os.environ['SOURCE_SHA']+'\nBuild and tests: '+os.environ['RUN_URL']+'\n')
          (p/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+str(f.relative_to(p))+'\n' for f in sorted(p.rglob('*')) if f.is_file() and f.suffix in ('.rbf','.mra')))
          PYCODE
          (cd built/pilot-build && zip -qr ../../1943-LLAPI-SNAC-autofire-experimental.zip .)
          gh release create v1943-llapi-snac-20261030-autofire-experimental --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title '1943 LLAPI + SNAC — hold autofire experimental' --notes-file built/pilot-build/LE-ME.md 1943-LLAPI-SNAC-autofire-experimental.zip built/pilot-build/cores/*.rbf built/pilot-build/mra/1943-LLAPI-SNAC-Test.mra built/pilot-build/SHA256SUMS built/pilot-build/SOURCE.txt built/pilot-build/reports/timing-acceptance.json

            cores/1943/mister/*.qsf
            cores/1943/mister/*.qip
  publish:
    needs: [source, controllers, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: 1943-LLAPI-pilot-${{ github.run_number }}
          path: built
      - name: Publish experimental 1943 autofire only after tests and timing pass
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json,os,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('built/pilot-build')
          d=json.loads((p/'reports/timing-acceptance.json').read_text())
          assert d['accepted'] and all(v>=0 for v in d['worst_slack_ns'].values())
          m=ET.parse(p/'mra/1943-LLAPI-SNAC-Test.mra')
          assert m.findtext('rbf')=='jt1943_llapi_snac'
          m.find('rbf').text='jt1943_llapi_snac_20261030_freebuttons'
          m.write(p/'mra/1943-LLAPI-SNAC-Test.mra',encoding='utf-8',xml_declaration=True)
          notes=p/'LE-ME.md'
          notes.write_text(notes.read_text()+'\nExact compiled source: '+os.environ['SOURCE_SHA']+'\nBuild and tests: '+os.environ['RUN_URL']+'\n')
          (p/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+str(f.relative_to(p))+'\n' for f in sorted(p.rglob('*')) if f.is_file() and f.suffix in ('.rbf','.mra')))
          PYCODE
          (cd built/pilot-build && zip -qr ../../1943-LLAPI-SNAC-freebuttons-experimental.zip .)
          gh release create v1943-llapi-snac-20261030-freebuttons-experimental --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title '1943 LLAPI + SNAC — free-button autofire experimental' --notes-file built/pilot-build/LE-ME.md 1943-LLAPI-SNAC-freebuttons-experimental.zip built/pilot-build/cores/*.rbf built/pilot-build/mra/1943-LLAPI-SNAC-Test.mra built/pilot-build/SHA256SUMS built/pilot-build/SOURCE.txt built/pilot-build/reports/timing-acceptance.json

name: 1943 LLAPI and SNAC free-button autofire with OSD pause
on:
  push:
    branches: [llapi-1943-test]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 1943-llapi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
      - name: Apply 1944 hold-autofire to 1943 and preserve OSD pause
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = llapi-1943-test
          python3 - <<'PYCODE'
          from pathlib import Path
          assert '.osd_shown      ( OSD_STATUS      )' in Path('modules/jtframe/target/mister/hdl/jtframe_mister.sv').read_text()
          Path('modules/jtframe/target/mister/hdl/jtframe_llapi_arcade.sv').write_text('// SPDX-License-Identifier: GPL-3.0-or-later\n// Experimental JTFRAME bridge for the MiSTer-LLAPI arcade protocol.\n// Protocol implementation and arcade button IDs originate in\n// MiSTer-LLAPI/Arcade-IremM62_MiSTer, commit 4d637039.\nmodule jtframe_llapi_arcade #(\n    parameter BUTTONS=3\n)(\n    input clk_50, clk_sys, rst, vblank, osd_active, enable,\n    input [6:0] user_in,\n    output logic [6:0] user_out,\n    input [15:0] usb1, usb2,\n    output [15:0] joy1, joy2,\n    output [3:0] start, coin,\n    output osd_request,\n    output [1:0] autofire_hold\n);\n    wire [31:0] buttons1, buttons2;\n    wire [7:0] type1,type2;\n    wire en1,en2,latch1,data1,latch2,data2;\n    (* async_reg="true" *) reg rst50_meta=1, rst50_sync=1;\n    (* async_reg="true" *) reg osd50_meta=0, osd50_sync=0;\n    reg seen1=0,seen2=0;\n    wire valid1=enable && en1 && type1!=8\'hff && (type1!=0 || seen1);\n    wire valid2=enable && en2 && type2!=8\'hff && (type2!=0 || seen2);\n    always @(posedge clk_50) begin\n        rst50_meta<=rst; rst50_sync<=rst50_meta;\n        osd50_meta<=osd_active; osd50_sync<=osd50_meta;\n        if(rst50_sync) begin seen1<=0; seen2<=0; end\n        else begin\n            if(en1 && type1!=8\'hff && |buttons1) seen1<=1;\n            if(en2 && type2!=8\'hff && |buttons2) seen2<=1;\n        end\n    end\n    // Same physical USER port wiring and enable polarity as the arcade cores.\n    always_comb begin\n        user_out=7\'h7f;\n        user_out[0]=latch1; user_out[1]=data1;\n        user_out[2]=osd50_sync;\n        user_out[4]=latch2; user_out[5]=data2;\n    end\n    LLAPI u_port1(.CLK_50M(clk_50),.LLAPI_SYNC(vblank),\n        .IO_LATCH_IN(user_in[0]),.IO_LATCH_OUT(latch1),\n        .IO_DATA_IN(user_in[1]),.IO_DATA_OUT(data1),.ENABLE(enable && ~osd50_sync),\n        .LLAPI_BUTTONS(buttons1),.LLAPI_ANALOG(),.LLAPI_TYPE(type1),\n        .LLAPI_MODES(),.LLAPI_EN(en1));\n    LLAPI u_port2(.CLK_50M(clk_50),.LLAPI_SYNC(vblank),\n        .IO_LATCH_IN(user_in[4]),.IO_LATCH_OUT(latch2),\n        .IO_DATA_IN(user_in[5]),.IO_DATA_OUT(data2),.ENABLE(enable && ~osd50_sync),\n        .LLAPI_BUTTONS(buttons2),.LLAPI_ANALOG(),.LLAPI_TYPE(type2),\n        .LLAPI_MODES(),.LLAPI_EN(en2));\n    // Button levels are slow asynchronous inputs, not a streamed data bus.\n    // Constrain only the first sampling stages; retain timing between stages.\n    (* async_reg="true" *) reg [31:0] buttons1_meta=0,buttons1_sync=0;\n    (* async_reg="true" *) reg [31:0] buttons2_meta=0,buttons2_sync=0;\n    (* async_reg="true" *) reg valid1_meta=0,valid1_sync=0;\n    (* async_reg="true" *) reg valid2_meta=0,valid2_sync=0;\n    always @(posedge clk_sys) begin\n        if(rst) begin\n            buttons1_meta<=0; buttons1_sync<=0;\n            buttons2_meta<=0; buttons2_sync<=0;\n            valid1_meta<=0; valid1_sync<=0;\n            valid2_meta<=0; valid2_sync<=0;\n        end else begin\n            buttons1_meta<=buttons1; buttons1_sync<=buttons1_meta;\n            buttons2_meta<=buttons2; buttons2_sync<=buttons2_meta;\n            valid1_meta<=valid1; valid1_sync<=valid1_meta;\n            valid2_meta<=valid2; valid2_sync<=valid2_meta;\n        end\n    end\n`ifdef JTFRAME_LLAPI_HOLD_AUTOFIRE\n    // Bit3 is unused by the existing arcade map (bits0..2 are game buttons).\n    // Current SNES reference maps it to X; Genesis six-button maps it to Y.\n    // Keep the already-tested bit2 autofire alias only in two-button cores.\n    assign autofire_hold={valid2_sync && (buttons2_sync[3] || (BUTTONS<3 && buttons2_sync[2])),\n                          valid1_sync && (buttons1_sync[3] || (BUTTONS<3 && buttons1_sync[2]))};\n`else\n    assign autofire_hold=0;\n`endif\n    jtframe_llapi_arcade_map #(.BUTTONS(BUTTONS)) u_map(\n        .buttons1(buttons1_sync),.buttons2(buttons2_sync),\n        .valid1(valid1_sync),.valid2(valid2_sync),.osd_active(osd_active),\n        .usb1(usb1),.usb2(usb2),.joy1(joy1),.joy2(joy2),\n        .start(start),.coin(coin),.osd_request(osd_request));\nendmodule\n\nmodule jtframe_llapi_arcade_map #(parameter BUTTONS=3)(\n    input [31:0] buttons1,buttons2,\n    input valid1,valid2,osd_active,\n    input [15:0] usb1,usb2,\n    output [15:0] joy1,joy2,\n    output [3:0] start,coin,\n    output osd_request\n);\n    wire [31:0] p1=valid1 ? buttons1 : 32\'d0;\n    wire [31:0] p2=valid2 ? buttons2 : 32\'d0;\n    assign osd_request=(p1[26]&p1[5]&p1[0]) | (p2[26]&p2[5]&p2[0]);\n    wire inhibit=osd_active | osd_request;\n    function automatic [15:0] game_buttons(input [31:0] p);\n        integer n;\n        begin\n            game_buttons=0;\n            game_buttons[3:0]=p[27:24]; // up, down, left, right\n            for(n=0;n<3;n=n+1)\n                if(n<BUTTONS) game_buttons[4+n]=p[n];\n        end\n    endfunction\n    // Preserve the existing arcade allocation: one LLAPI socket reserves\n    // its player slot; USB player 1 fills the other slot.\n    assign joy1=valid1 ? (inhibit ? 16\'d0 : game_buttons(p1)) : usb1;\n    assign joy2=valid2 ? (inhibit ? 16\'d0 : game_buttons(p2)) :\n                         (valid1 ? usb1 : usb2);\n    // Arcade convention: button 5 starts P1 and button 6 starts P2,\n    // from either socket. Button 4 is that socket\'s coin input.\n    assign start=inhibit ? 4\'d0 : {2\'b0,p1[6]|p2[6],p1[5]|p2[5]};\n    assign coin=inhibit ? 4\'d0 : {2\'b0,p2[4],p1[4]};\nendmodule\n\n')
          Path('modules/jtframe/target/mister/hdl/jtframe_serial_arcade.sv').write_text('// SPDX-License-Identifier: GPL-3.0-or-later\n// Optional digital SNAC readers for the 1943 LLAPI pilot.\n// USER pin assignments follow MiSTer-devel SNES, Genesis and Saturn cores.\n// Saturn nibble order also checked against Timothy Redaelli\'s joydb9saturn\n// reader in MiSTer-DB9/jtcores; this is a single-port SNAC implementation.\nmodule jtframe_serial_arcade #(parameter BUTTONS=3)(\n    input clk_50,clk_sys,rst,vblank,osd_active,\n    input [2:0] mode, // 0 LLAPI, 1 Saturn, 2 SEGA, 3 original DB15, 4 SNES\n    input [6:0] user_in,\n    output [6:0] user_out,\n    input [15:0] usb1,usb2,\n    output [15:0] joy1,joy2,\n    output [3:0] start,coin,\n    output db15_drive,\n    output osd_request\n);\n    (* async_reg="true" *) reg [2:0] mode_meta=0,mode50=0;\n    reg [2:0] previous_mode=0;\n    reg [12:0] settle=7500;\n    wire ready50=(settle==0) && mode50==previous_mode;\n    always @(posedge clk_50) begin\n        mode_meta<=mode; mode50<=mode_meta;\n        previous_mode<=mode50;\n        if(mode50!=previous_mode) settle<=13\'d7500; // 150 us released\n        else if(settle!=0) settle<=settle-1\'b1;\n    end\n    wire [6:0] llapi_out,snac_out;\n    wire [15:0] llapi_joy1,llapi_joy2;\n    wire [3:0] llapi_start,llapi_coin;\n    wire llapi_osd;\n    wire [1:0] llapi_af,snac_af;\n    jtframe_llapi_arcade #(.BUTTONS(BUTTONS)) u_llapi(\n        .clk_50(clk_50),.clk_sys(clk_sys),.rst(rst),.vblank(vblank),\n        .enable(ready50 && mode50==0),.osd_active(osd_active),\n        .user_in(user_in),.user_out(llapi_out),.usb1(usb1),.usb2(usb2),\n        .joy1(llapi_joy1),.joy2(llapi_joy2),.start(llapi_start),\n        .coin(llapi_coin),.osd_request(llapi_osd),.autofire_hold(llapi_af));\n    wire [8:0] snac_pad,snac_pad2;\n    wire [1:0] reader_mode=mode50==1 ? 3 : mode50==2 ? 2 : mode50==4 ? 1 : 0;\n    jtframe_snac_arcade u_snac(.clk_50(clk_50),\n        .enable(ready50 && reader_mode!=0),.mode(reader_mode),\n        .user_in(user_in),.user_out(snac_out),.pad(snac_pad),.pad2(snac_pad2),.autofire_hold(snac_af));\n    // Only one mux drives the physical connector. Inactive readers cannot\n    // drive pins, and all pins are released while changing protocol.\n    assign db15_drive=ready50 && mode50==3;\n    wire db_clk,db_load;\n    wire [15:0] db1,db2;\n    // Preserve Jotego\'s original Antonio Villena DB15 splitter reader.\n    joy_db15 u_db15(.clk(clk_50),.JOY_CLK(db_clk),.JOY_LOAD(db_load),\n        .JOY_DATA(user_in[5]),.joystick1(db1),.joystick2(db2));\n    wire [8:0] port1=mode50==3 ? {db1[11:10],db1[6:0]} : snac_pad;\n    wire [8:0] port2=mode50==3 ? {db2[11:10],db2[6:0]} : mode50==4 ? snac_pad2 : 9\'d0;\n    assign user_out=!ready50 ? 7\'h7f : mode50==0 ? llapi_out :\n                    mode50==3 ? {5\'h1f,db_clk,db_load} : snac_out;\n    (* async_reg="true" *) reg [8:0] pad_meta=0,pad_sys=0,pad2_meta=0,pad2_sys=0;\n    (* async_reg="true" *) reg [2:0] active_meta=0,active_sys=0;\n    (* async_reg="true" *) reg ready_meta=0,ready_sys=0;\n    always @(posedge clk_sys) begin\n        pad_meta<=port1; pad_sys<=pad_meta;\n        pad2_meta<=port2; pad2_sys<=pad2_meta;\n        active_meta<=mode50; active_sys<=active_meta;\n        ready_meta<=ready50; ready_sys<=ready_meta;\n    end\n    wire stable=ready_sys && active_sys==mode;\n    wire snac_selected=stable && active_sys!=0 && active_sys<=4;\n    wire db15_selected=stable && active_sys==3;\n    wire dual_snac=stable && (active_sys==3 || active_sys==4);\n    wire snac_menu=snac_selected && (db15_selected ?\n        ((pad_sys[7] && pad_sys[6]) || (pad2_sys[7] && pad2_sys[6])) :\n        ((pad_sys[2] && pad_sys[7] && pad_sys[4]) ||\n         (active_sys==4 && pad2_sys[2] && pad2_sys[7] && pad2_sys[4])));\n    wire inhibit=osd_active || snac_menu;\n    wire [15:0] raw_joy1,raw_joy2;\n    assign raw_joy1=!stable ? usb1 : !snac_selected ? llapi_joy1 :\n                 inhibit ? 16\'d0 : {9\'d0,pad_sys[6:0]};\n    assign raw_joy2=!stable ? usb2 : dual_snac ?\n                 (inhibit ? 16\'d0 : {9\'d0,pad2_sys[6:0]}) :\n                 snac_selected ? usb1 : llapi_joy2;\n`ifdef JTFRAME_LLAPI_HOLD_AUTOFIRE\n    (* async_reg="true" *) reg [1:0] snac_af_meta=0,snac_af_sys=0;\n    (* async_reg="true" *) reg vb_meta=0,vb_sync=0;\n    always @(posedge clk_sys) begin\n        snac_af_meta<=snac_af;snac_af_sys<=snac_af_meta;\n        vb_meta<=vblank;vb_sync<=vb_meta;\n    end\n    wire [1:0] held=stable && !inhibit ?\n        (active_sys==0 ? llapi_af : (active_sys==4 || active_sys==2) ? snac_af_sys : 2\'b0) : 2\'b0;\n    wire fire1,fire2;\n    hold_autofire af1(clk_sys,rst,vb_sync,held[0],raw_joy1[4],inhibit,fire1);\n    hold_autofire af2(clk_sys,rst,vb_sync,held[1],raw_joy2[4],inhibit,fire2);\n    assign joy1={raw_joy1[15:5],fire1,raw_joy1[3:0]};\n    assign joy2={raw_joy2[15:5],fire2,raw_joy2[3:0]};\n`else\n    assign joy1=raw_joy1;assign joy2=raw_joy2;\n`endif\n    assign start=!stable ? 4\'d0 : !snac_selected ? llapi_start :\n                 {2\'d0,dual_snac && pad2_sys[7] && !inhibit,\n                  pad_sys[7] && (!pad_sys[8] || db15_selected) && !inhibit};\n    assign coin=!stable ? 4\'d0 : !snac_selected ? llapi_coin :\n                 {2\'d0,dual_snac && pad2_sys[8] && !inhibit,pad_sys[8] && !inhibit};\n    assign osd_request=stable && (snac_selected ? snac_menu : llapi_osd);\nendmodule\n\nmodule jtframe_snac_arcade #(\n    parameter TICK_CYCLES=500, // 10 us at 50 MHz; shortened only in simulation\n    parameter SCAN_TICKS=250  // 2.5 ms; allows MD six-button timeout to reset\n)(\n    input clk_50,enable,\n    input [1:0] mode, // 1 SNES, 2 Mega Drive, 3 Saturn digital\n    input [6:0] user_in,\n    output reg [6:0] user_out=7\'h7f,\n    // [8] coin, [7] start, [6:4] buttons, [3:0] UDLR, active high\n    output reg [1:0] autofire_hold=0,\n    output reg [8:0] pad=0,pad2=0\n);\n    (* async_reg="true" *) reg [6:0] input_meta=7\'h7f,input_sync=7\'h7f;\n    always @(posedge clk_50) begin input_meta<=user_in; input_sync<=input_meta; end\n    reg [15:0] ticks=0;\n    reg [8:0] phase=0;\n    reg [2:0] old_mode=0;\n    reg [15:0] snes=16\'hffff,snes2=16\'hffff;\n    reg [5:0] md_high=6\'h3f;\n    reg [1:0] md_as=2\'b11;\n    reg md_valid=0,md_six=0;\n    reg [3:0] md_extra=4\'hf;\n    reg [3:0] sat_extra=4\'hf,sat_main=4\'hf,sat_dir=4\'hf;\n    wire [5:0] md_in={input_sync[6],input_sync[2],input_sync[3],input_sync[5],input_sync[0],input_sync[1]}; // C B R L D U\n    wire [3:0] sat_in={input_sync[3],input_sync[5],input_sync[0],input_sync[1]}; // D3..D0\n    always @(posedge clk_50) begin\n        old_mode<={1\'b0,mode};\n        if(!enable || mode==0 || {1\'b0,mode}!=old_mode) begin\n            autofire_hold<=0; ticks<=0; phase<=0; user_out<=7\'h7f; pad<=0; pad2<=0;\n            snes<=16\'hffff; snes2<=16\'hffff; md_valid<=0; md_six<=0;\n            md_high<=6\'h3f; md_as<=2\'b11; md_extra<=4\'hf;\n            sat_extra<=4\'hf; sat_main<=4\'hf; sat_dir<=4\'hf;\n        end else if(ticks==TICK_CYCLES-1) begin\n            ticks<=0;\n            phase<=phase==SCAN_TICKS-1 ? 0 : phase+1\'b1;\n            case(mode)\n                1: begin\n                    // Official SNES dual-port SNAC: shared latch USER0,\n                    // P1 clock/data USER1/5, P2 clock/data USER3/6.\n                    // Sample before each falling edge; controller advances\n                    // on that edge, leaving a full period for the next bit.\n                    if(phase==0 || phase==1) begin user_out<=7\'h7f; snes<=16\'hffff; snes2<=16\'hffff; end\n                    if(phase==2) user_out[0]<=0;\n                    if(phase>=3 && phase<=33 && phase[0]) begin\n                        snes[(phase-3)>>1]<=input_sync[5];\n                        snes2[(phase-3)>>1]<=input_sync[6];\n                        user_out[1]<=0; user_out[3]<=0;\n                    end\n                    if(phase>=4 && phase<=34 && !phase[0]) begin user_out[1]<=1; user_out[3]<=1; end\n                    if(phase==35) begin\n                        autofire_hold<={(snes2[15:12]==4\'hf)&&!snes2[9],(snes[15:12]==4\'hf)&&!snes[9]};\n                        if(snes[15:12]==4\'hf)\n                            pad<={~snes[2],~snes[3],~snes[1],~snes[8],~snes[0],~snes[4],~snes[5],~snes[6],~snes[7]};\n                        else pad<=0;\n                        if(snes2[15:12]==4\'hf)\n                            pad2<={~snes2[2],~snes2[3],~snes2[1],~snes2[8],~snes2[0],~snes2[4],~snes2[5],~snes2[6],~snes2[7]};\n                        else pad2<=0;\n                    end\n                end\n                2: begin\n                    // Mega Drive: TH=USER4. Other pins remain released inputs.\n                    case(phase)\n                        0: begin user_out<=7\'h6f; md_six<=0; md_extra<=4\'hf; end\n                        1: user_out[4]<=1;\n                        2: begin md_high<=md_in; user_out[4]<=0; end\n                        3: begin md_as<=md_in[5:4]; md_valid<=(md_in[3:2]==0); user_out[4]<=1; end\n                        4: user_out[4]<=0;\n                        5: begin md_six<=(md_in[3:0]==0); user_out[4]<=1; end\n                        6: begin md_extra<=md_in[3:0]; user_out[4]<=0; end\n                        7: begin\n                            user_out[4]<=1;\n                            // MD6 X is separate from ABC/Mode/Start and only\n                            // valid after the extension handshake; MD3 has no X.\n                            autofire_hold<={1\'b0,md_valid && md_six && !md_extra[2]};\n                            if(md_valid) begin\n                                pad[3:0]<=~{md_high[0],md_high[1],md_high[2],md_high[3]};\n                                pad[6:4]<=~{md_high[5],md_as[0],md_high[4]}; // C,A,B => buttons 3,2,1\n                                pad[7]<=~md_as[1];\n                                // Mode on a 6-button pad; Down+Start also\n                                // works on a 3-button pad (consumes Start).\n                                pad[8]<=(md_six && !md_extra[3]) || (!md_high[1] && !md_as[1]);\n                            end else pad<=0;\n                        end\n                    endcase\n                end\n                3: begin\n                    // Saturn digital: TH=USER4, TR=USER6; D3..0 use\n                    // USER3,5,0,1. TL/USER2 is released (input).\n                    case(phase)\n                        0: user_out<=7\'h2f; // TH=0, TR=0\n                        1: begin sat_extra<=sat_in; user_out[4]<=1; end\n                        2: begin sat_main<=sat_in; user_out[4]<=0; user_out[6]<=1; end\n                        3: begin sat_dir<=sat_in; user_out[4]<=1; end\n                        4: begin\n                            // Digital pad ID: final phase is {L,1,0,0}.\n                            // Reject an analog-handshake pad instead of\n                            // retaining stale data or inventing button presses.\n                            if(sat_in[2:0]==3\'b100) begin\n                                pad[3:0]<=~{sat_dir[0],sat_dir[1],sat_dir[2],sat_dir[3]};\n                                pad[6:4]<=~{sat_main[2],sat_main[1],sat_main[0]}; // A,C,B\n                                pad[7]<=~sat_main[3];\n                                pad[8]<=~sat_in[3]; // L inserts coin\n                            end else pad<=0;\n                        end\n                    endcase\n                end\n            endcase\n        end else ticks<=ticks+1\'b1;\n    end\nendmodule\n\n\n`ifdef JTFRAME_LLAPI_HOLD_AUTOFIRE\n// SPDX-License-Identifier: GPL-3.0-or-later\n// Frame-based hold-to-fire pulse generator; map the physical button upstream.\nmodule hold_autofire #(parameter HALF_PERIOD_FRAMES=3)(\n input clk,rst,frame,hold_button,manual_fire,inhibit,\n output fire\n);\nlocalparam CW=HALF_PERIOD_FRAMES<2 ? 1 : $clog2(HALF_PERIOD_FRAMES);\nreg [CW-1:0] count=0;\nreg phase=1,previous_frame=0;\nalways @(posedge clk) begin\n previous_frame<=frame;\n if(rst || inhibit || !hold_button) begin count<=0;phase<=1;end\n else if(frame && !previous_frame) begin\n  if(count==HALF_PERIOD_FRAMES-1) begin count<=0;phase<=~phase;end\n  else count<=count+1\'b1;\n end\nend\nassign fire=!rst && !inhibit && (manual_fire || (hold_button && phase));\nendmodule\n\n`endif\n')
          Path('tests/llapi/hold_autofire.sv').write_text("// SPDX-License-Identifier: GPL-3.0-or-later\n// Frame-based hold-to-fire pulse generator; map the physical button upstream.\nmodule hold_autofire #(parameter HALF_PERIOD_FRAMES=3)(\n input clk,rst,frame,hold_button,manual_fire,inhibit,\n output fire\n);\nlocalparam CW=HALF_PERIOD_FRAMES<2 ? 1 : $clog2(HALF_PERIOD_FRAMES);\nreg [CW-1:0] count=0;\nreg phase=1,previous_frame=0;\nalways @(posedge clk) begin\n previous_frame<=frame;\n if(rst || inhibit || !hold_button) begin count<=0;phase<=1;end\n else if(frame && !previous_frame) begin\n  if(count==HALF_PERIOD_FRAMES-1) begin count<=0;phase<=~phase;end\n  else count<=count+1'b1;\n end\nend\nassign fire=!rst && !inhibit && (manual_fire || (hold_button && phase));\nendmodule\n")
          Path('tests/llapi/hold_autofire_tb.sv').write_text('`timescale 1ns/1ps\nmodule hold_autofire_tb;\nreg clk=0,rst=1,frame=0,a=0,b=0,manual=0,inhibit=0;\nwire fa,fb;\nalways #5 clk=~clk;\nhold_autofire p1(clk,rst,frame,a,manual,inhibit,fa);\nhold_autofire p2(clk,rst,frame,b,1\'b0,inhibit,fb);\ntask tick;begin @(negedge clk);end endtask\ntask nextframe;begin frame=1;repeat(4)tick();frame=0;repeat(4)tick();end endtask\ninitial begin\n repeat(3)tick();rst=0;tick();\n if(fa||fb)$fatal(1,"idle");\n a=1;tick();if(!fa||fb)$fatal(1,"immediate fire and independent P2");\n nextframe();nextframe();if(!fa)$fatal(1,"on duration");\n nextframe();if(fa)$fatal(1,"off phase");\n b=1;tick();if(!fb||fa)$fatal(1,"independent hold phase");\n manual=1;tick();if(!fa)$fatal(1,"manual shot priority");\n manual=0;a=0;tick();if(fa)$fatal(1,"release stops immediately");\n inhibit=1;tick();if(fa||fb)$fatal(1,"OSD inhibition");\n inhibit=0;tick();if(!fb)$fatal(1,"resume clean phase");\n rst=1;tick();if(fa||fb)$fatal(1,"reset releases inputs");\n $display("PASS hold/release, frame rate, independent players, manual shot, OSD and reset");$finish;\nend\nendmodule\n')
          Path('tests/llapi/build-1943.sh').write_text('#!/usr/bin/env bash\nset -euo pipefail\n# Run inside Jotego\'s public jtcore20 build container, with this repo at /jtcores.\ncd /jtcores\n# The container runs as root; trust only this mounted source checkout.\ngit config --global --add safe.directory /jtcores\nexport JTROOT=/jtcores\nexport JTFRAME=$JTROOT/modules/jtframe\nexport MODULES=$JTROOT/modules\nexport CORES=$JTROOT/cores\nexport JTBIN=$JTROOT/release\nexport RLS=$JTBIN\nexport MRA=$JTBIN/mra\nexport ROM=$JTROOT/rom\nexport POCKET=$JTFRAME/target/pocket\nexport JTUTIL=/tmp/llapi-support\nexport PATH=/tmp/llapi-tools:$JTFRAME/bin:/usr/local/go/bin:$PATH\nmkdir -p /tmp/llapi-tools "$JTUTIL" "$JTBIN" pilot-reports\n# Set only build variables; do not source scripts that override CODEX_HOME.\n(cd "$JTFRAME/src/jtframe" && go build -o /tmp/llapi-tools/jtframe .)\n# Decode no game ROMs and use the official Euro MRA supplied with this pilot.\n# Strict JTFRAME timing acceptance stays enabled for all attempts.\nsuccess=0\nfor seed in 1 2 3; do\n    if jtcore 1943 -mister --nodbg --nolinter --clean --seed "$seed" > "pilot-reports/seed-$seed.log" 2>&1; then\n        success=1\n        printf \'%s\\n\' "$seed" > pilot-reports/accepted-seed.txt\n        break\n    fi\n    cp -f log/mister/jt1943* pilot-reports/ 2>/dev/null || true\n    if ! grep -q \'^FAIL$\' "pilot-reports/seed-$seed.log"; then\n        tail -100 "pilot-reports/seed-$seed.log"\n        exit 1\n    fi\ndone\nif test "$success" != 1; then\n    echo \'No seed passed compilation and strict timing acceptance.\'\n    exit 1\nfi\npython3 tests/llapi/check-timing.py\nmkdir -p pilot-build/cores pilot-build/mra pilot-build/reports\ncp release/mister/jt1943.rbf pilot-build/cores/jt1943_llapi_snac_20261030_freebuttons.rbf\ncp tests/llapi/1943-LLAPI-SNAC-Test.mra pilot-build/mra/\ncp tests/llapi/README.md pilot-build/LE-ME.md\ncp pilot-reports/* pilot-build/reports/\ncp cores/1943/mister/output_files/*.summary pilot-build/reports/ 2>/dev/null || true\ncp cores/1943/mister/output_files/*.sta.rpt pilot-build/reports/ 2>/dev/null || true\nprintf \'Source: %s\\nUpstream: b222692d4c0c9a26a6cb3c99c6820b1ed4a5d565\\nArcade LLAPI: 4d63703988cfb2b8256fc3bdb1a4a09b39cceaba\\n\' "$(git rev-parse HEAD)" > pilot-build/SOURCE.txt\n(cd pilot-build && sha256sum cores/*.rbf mra/*.mra > SHA256SUMS)\n')
          Path('tests/llapi/README.md').write_text("# 1943 LLAPI + SNAC — free-button autofire experimental\n\nHold the autofire button to shoot repeatedly; release it to stop. This is not a toggle. Manual fire, bomb, the 1943 third-button loop, coin, Start and menu shortcuts retain their previous mappings.\n\nLLAPI uses previously unused packet bit 3: SNES X and Mega Drive six-button Y in the current MiSTer-LLAPI SNES/Genesis reference cores. Custom adapter mappings can change the physical label. The existing 1944 bit-2 autofire alias is retained; 1943 bit 2 retains its original third-button loop. SNAC SNES uses X; SNAC Mega Drive six-button uses X only after a valid six-button handshake. Three-button Mega Drive controls are unchanged and do not gain autofire.\n\nLLAPI 2P is the default. Other serial modes: SNAC SATURN 1P (digital only), SNAC DB9 1P (Mega Drive), SNAC DB15 2P (Ultimate SNAC DB15), SNAC SNES 2P (compatible dual-port adapter required). Keep DE10-Nano SW1 OFF. No Bliss-Box cable profile, analog Saturn handshake or multitaps. OSD pause is retained. No controller routing changes are included.\n\nNew free-button revisions require physical validation. UltimateMiSTer confirmed the previous 1944 autofire, LLAPI P1 and SNAC SNES 2P; the reported 1944 LLAPI port-2 issue is deferred. Previous 1943 controller modes and OSD pause were physically confirmed; its upstream credits page is intentionally static. Automated tests and Quartus timing checks do not establish hardware validation of this revision.\n\nInstall matching MRA and RBF together. Supply your own compatible game ROMs. No ROM data is included. Independent experimental MiSTer-LLAPI integration of Jotego's cores; original credits, licenses and source history are preserved. Please support https://patreon.com/jotego.\n\nMapping references: https://github.com/MiSTer-LLAPI/SNES_MiSTer/blob/master/SNES.sv and https://github.com/MiSTer-LLAPI/Genesis_MiSTer/blob/master/Genesis.sv\n")
          Path('tests/llapi/hold_1943_tb.sv').write_text('`timescale 1ns/1ps\nmodule hold_1943_tb #(parameter BUTTONS=3);\nreg clk=0,rst=1,frame=0,osd=0;always #5 clk=~clk;\nwire [15:0] j1,j2;wire [6:0] uo;wire [3:0] st,co;wire db,menu;\njtframe_serial_arcade #(.BUTTONS(BUTTONS)) dut(.clk_50(clk),.clk_sys(clk),.rst(rst),.vblank(frame),.osd_active(osd),.mode(3\'d0),.user_in(7\'h7f),.user_out(uo),.usb1(16\'d0),.usb2(16\'d0),.joy1(j1),.joy2(j2),.start(st),.coin(co),.db15_drive(db),.osd_request(menu));\ntask settle;begin repeat(12)@(negedge clk);end endtask\ntask nextframe;begin frame=1;settle();frame=0;settle();end endtask\ninitial begin\n settle();rst=0;repeat(8000)@(negedge clk);\n force dut.u_llapi.valid1_sync=1;force dut.u_llapi.valid2_sync=1;\n force dut.u_llapi.buttons1_sync=32\'h00000008;force dut.u_llapi.buttons2_sync=0;\n settle();if(!j1[4]||j1[6]||j1[5]||j2)$fatal(1,"X must autofire P1 without loop/bomb/P2");\n nextframe();nextframe();nextframe();if(j1[4]||j1[6])$fatal(1,"X off phase");\n force dut.u_llapi.buttons1_sync=32\'h00000009;settle();if(!j1[4]||j1[6])$fatal(1,"manual shot overrides off phase without loop");\n force dut.u_llapi.buttons1_sync=0;force dut.u_llapi.buttons2_sync=8;\n settle();if(j1||!j2[4]||j2[6]||j2[5])$fatal(1,"P2 independent autofire without loop/bomb");\n osd=1;settle();if(j1||j2)$fatal(1,"OSD suppresses autofire");\n osd=0;force dut.u_llapi.buttons2_sync=0;settle();if(j1||j2)$fatal(1,"release stops");\n force dut.u_llapi.buttons1_sync=2;settle();if(!j1[5]||j1[4]||j1[6])$fatal(1,"bomb retained");\n force dut.u_llapi.buttons1_sync=4;settle();\n if(BUTTONS==3) begin\n  if(!j1[6]||j1[4]||dut.llapi_af[0])$fatal(1,"original third button/loop preserved without autofire");\n end else begin\n  if(j1[6]||!j1[4])$fatal(1,"1944 tested bit2 autofire alias preserved");\n end\n $display("PASS free bit3 autofire; old bit2 loop or legacy1944 alias preserved, manual controls, OSD and independent ports");$finish;\nend\nendmodule\n')
          p=Path('cores/1943/cfg/macros.def'); s=p.read_text()
          if 'JTFRAME_LLAPI_HOLD_AUTOFIRE' not in s: p.write_text(s+'\nJTFRAME_LLAPI_HOLD_AUTOFIRE\n')
          Path('tests/llapi/llapi_free_buttons_tb.sv').write_text('`timescale 1ns/1ps\nmodule hold_1943_tb #(parameter BUTTONS=3);\nreg clk=0,rst=1,frame=0,osd=0;always #5 clk=~clk;\nwire [15:0] j1,j2;wire [6:0] uo;wire [3:0] st,co;wire db,menu;\njtframe_serial_arcade #(.BUTTONS(BUTTONS)) dut(.clk_50(clk),.clk_sys(clk),.rst(rst),.vblank(frame),.osd_active(osd),.mode(3\'d0),.user_in(7\'h7f),.user_out(uo),.usb1(16\'d0),.usb2(16\'d0),.joy1(j1),.joy2(j2),.start(st),.coin(co),.db15_drive(db),.osd_request(menu));\ntask settle;begin repeat(12)@(negedge clk);end endtask\ntask nextframe;begin frame=1;settle();frame=0;settle();end endtask\ninitial begin\n settle();rst=0;repeat(8000)@(negedge clk);\n force dut.u_llapi.valid1_sync=1;force dut.u_llapi.valid2_sync=1;\n force dut.u_llapi.buttons1_sync=32\'h00000008;force dut.u_llapi.buttons2_sync=0;\n settle();if(!j1[4]||j1[6]||j1[5]||j2)$fatal(1,"X must autofire P1 without loop/bomb/P2");\n nextframe();nextframe();nextframe();if(j1[4]||j1[6])$fatal(1,"X off phase");\n force dut.u_llapi.buttons1_sync=32\'h00000009;settle();if(!j1[4]||j1[6])$fatal(1,"manual shot overrides off phase without loop");\n force dut.u_llapi.buttons1_sync=0;force dut.u_llapi.buttons2_sync=8;\n settle();if(j1||!j2[4]||j2[6]||j2[5])$fatal(1,"P2 independent autofire without loop/bomb");\n osd=1;settle();if(j1||j2)$fatal(1,"OSD suppresses autofire");\n osd=0;force dut.u_llapi.buttons2_sync=0;settle();if(j1||j2)$fatal(1,"release stops");\n force dut.u_llapi.buttons1_sync=2;settle();if(!j1[5]||j1[4]||j1[6])$fatal(1,"bomb retained");\n force dut.u_llapi.buttons1_sync=4;settle();\n if(BUTTONS==3) begin\n  if(!j1[6]||j1[4]||dut.llapi_af[0])$fatal(1,"original third button/loop preserved without autofire");\n end else begin\n  if(j1[6]||!j1[4])$fatal(1,"1944 tested bit2 autofire alias preserved");\n end\n $display("PASS free bit3 autofire; old bit2 loop or legacy1944 alias preserved, manual controls, OSD and independent ports");$finish;\nend\nendmodule\n')
          Path('tests/llapi/snac_free_buttons_tb.sv').write_text('`timescale 1ns/1ps\nmodule snac_readers_tb;\n    reg clk=0; always #10 clk=~clk;\n    reg enable=0;\n    reg [1:0] mode=0;\n    wire [6:0] pins;\n    wire [8:0] pad;\n    wire [1:0] held;\n    reg unplug=0,six=1;\n    reg [15:0] snes_pressed=0;\n    integer snes_bit=0;\n    reg [5:0] md_pressed=0; // C B R L D U\n    reg [1:0] md_as_pressed=0; // Start A\n    reg [3:0] md_extra_pressed=0; // Mode X Y Z\n    integer md_count=0,idle=0;\n    reg [3:0] sat_main_pressed=0,sat_dir_pressed=0;\n    reg sat_l=0;\n    reg [6:0] input_pins;\n    jtframe_snac_arcade #(.TICK_CYCLES(8),.SCAN_TICKS(80)) dut(\n        .clk_50(clk),.enable(enable),.mode(mode),.user_in(input_pins),\n        .user_out(pins),.pad(pad),.autofire_hold(held));\n    // Independent pin-level controller models, active-low electrical inputs.\n    always @(negedge pins[0]) snes_bit=0;\n    always @(negedge pins[1]) if(mode==1 && !pins[0] && snes_bit<15) snes_bit=snes_bit+1;\n    always @(negedge pins[4]) if(mode==2) md_count=md_count+1;\n    always @(posedge clk) begin\n        if(mode!=2 || !enable) begin idle=0;md_count=0;end\n        else if(pins[4]) begin\n            idle=idle+1;\n            if(idle>100) md_count=0;\n        end else idle=0;\n    end\n    reg [5:0] md_data;\n    reg [3:0] sat_data;\n    always @* begin\n        input_pins=7\'h7f;\n        md_data=~md_pressed;\n        if(!pins[4]) begin\n            md_data={~md_as_pressed,2\'b00,~md_pressed[1:0]};\n            if(six && md_count==3) md_data[3:0]=0;\n        end else if(six && md_count==3) md_data={2\'b11,~md_extra_pressed};\n        case({pins[6],pins[4]})\n            0: sat_data=4\'hf;\n            1: sat_data=~sat_main_pressed;\n            2: sat_data=~sat_dir_pressed;\n            3: sat_data={~sat_l,3\'b100};\n        endcase\n        if(mode==1) input_pins[5]=pins[0] ? ~snes_pressed[0] : ~snes_pressed[snes_bit];\n        if(mode==2) begin\n            input_pins[6]=md_data[5];input_pins[2]=md_data[4];\n            input_pins[3]=md_data[3];input_pins[5]=md_data[2];\n            input_pins[0]=md_data[1];input_pins[1]=md_data[0];\n        end\n        if(mode==3) begin\n            begin\n                input_pins[3]=sat_data[3];input_pins[5]=sat_data[2];\n                input_pins[0]=sat_data[1];input_pins[1]=sat_data[0];\n            end\n        end\n        if(unplug) input_pins=7\'h7f;\n    end\n    task scan; begin repeat(1500) @(negedge clk); end endtask\n    task expect_pad(input [8:0] value);begin\n        if(pad!==value) $fatal(1,"mode %d expected %h got %h",mode,value,pad);\n    end endtask\n    task select_mode(input [1:0] value);begin\n        enable=0;repeat(5) @(negedge clk);\n        if(pins!==7\'h7f || pad!==0) $fatal(1,"inactive reader drives pins or buttons");\n        mode=value;enable=1;scan();\n    end endtask\n    integer button;\n    initial begin\n        snes_pressed=(1<<0)|(1<<2)|(1<<4); // B, Select, Up\n        select_mode(1);expect_pad(9\'h118);\n        snes_pressed=0;scan();expect_pad(0);\n        snes_pressed=(1<<8)|(1<<3)|(1<<5);scan();expect_pad(9\'h0a4); // A,Start,Down\n        md_pressed=(1<<4)|(1<<2);md_as_pressed=2\'b10;md_extra_pressed=4\'b1000;\n        select_mode(2);expect_pad(9\'h192); // B,Left,Start,Mode\n        md_pressed=0;md_as_pressed=0;md_extra_pressed=4\'b0100;scan();expect_pad(0);\n        if(held!==1) $fatal(1,"MD6 X must only request autofire");\n        repeat(600) begin @(negedge clk);if(held!==1)$fatal(1,"held MD6 X must persist across serial scans");end\n        md_extra_pressed=0;scan();if(held!==0)$fatal(1,"release MD6 X");\n        md_pressed=6\'b110000;md_as_pressed=2\'b10;md_extra_pressed=4\'b1000;scan();expect_pad(9\'h1d0);\n        if(held!==0)$fatal(1,"B C Mode Start cannot activate autofire");\n        md_extra_pressed=4\'b0111;scan();if(held!==1)$fatal(1,"MD6 X with Y/Z");\n        six=0;md_pressed=0;md_as_pressed=0;scan();if(held!==0)$fatal(1,"MD3 must never enable extension autofire");\n        six=0;md_pressed=(1<<1);md_as_pressed=2\'b10;scan();expect_pad(9\'h184); // Down+Start coin\n        // A real three-button pad must retain each standard control, even\n        // though it never returns the six-button extension signature.\n        md_pressed=0;md_as_pressed=0;six=0;\n        for(button=0;button<6;button=button+1) begin\n            md_pressed=6\'b1<<button;scan();\n            case(button)\n                0: expect_pad(9\'h008); // Up\n                1: expect_pad(9\'h004); // Down\n                2: expect_pad(9\'h002); // Left\n                3: expect_pad(9\'h001); // Right\n                4: expect_pad(9\'h010); // B: shoot\n                5: expect_pad(9\'h040); // C: third button\n            endcase\n        end\n        md_pressed=0;md_as_pressed=1;scan();expect_pad(9\'h020); // A: bomb\n        md_as_pressed=2;scan();expect_pad(9\'h080); // Start\n        unplug=1;scan();expect_pad(0);unplug=0;\n        sat_main_pressed=1;sat_dir_pressed=1;sat_l=1;\n        select_mode(3);expect_pad(9\'h118); // B,Up,L\n        sat_main_pressed=0;sat_dir_pressed=0;sat_l=0;scan();expect_pad(0);\n        unplug=1;scan();expect_pad(0);unplug=0;\n        enable=0;repeat(5) @(negedge clk);\n        if(pins!==7\'h7f) $fatal(1,"pins not released");\n        $display("PASS: SNES serial edges, MD 3/6-button handshake, Saturn digital pinout, release and disconnect");\n        $finish;\n    end\nendmodule\n')
          PYCODE

{
  "name": "1944 Enhanced - driver 0.5",
  "on": {
    "push": {
      "branches": [
        "test-1944-llapi-v050"
      ],
      "paths": [
        ".github/workflows/1944-llapi-v050.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "test-1944-llapi-v050",
    "cancel-in-progress": false
  },
  "jobs": {
    "candidate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "env": {
        "VARIANT": "candidate",
        "BUILD_IMAGE": "jotego/jtcore20@sha256:a0397645aeac483f90718c89e5fd491c4889db6e4202bcba7f7f7770e14beb6b"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "ref": "b222692d4c0c9a26a6cb3c99c6820b1ed4a5d565",
            "persist-credentials": false,
            "sparse-checkout": "cores/1944\ncores/cps1\ncores/cps15\ncores/cps2\nmodules/jtframe\nmodules/jteeprom\nmodules/fx68k\nmodules/jtdsp16\nmodules/jt12\ntests/llapi\ncores/1943\ncores/trojan\ncores/gng\nmodules/jt8051\ncores/contra\nmodules/jt51"
          }
        },
        {
          "name": "Fetch exact baseline submodules",
          "run": "git submodule update --init --recursive --depth 1 modules/fx68k modules/jtdsp16 modules/jt12 modules/jt51"
        },
        {
          "name": "Restore pinned shared Enhanced menu sources",
          "run": "curl -fsSL --retry 3 https://raw.githubusercontent.com/$GITHUB_REPOSITORY/a5d760a27c09aea53071788038d8a66512365be8/.github/workflows/contra-poll-diagnostic.yml -o /tmp/shared.json\npython3 - <<'PYCODE'\nimport json,subprocess\nfor s in json.load(open('/tmp/shared.json'))['jobs']['candidate']['steps'][2:6]:\n subprocess.run(['bash','-e'],input=s['run'].replace('$GITHUB_SHA','a5d760a27c09aea53071788038d8a66512365be8'),text=True,check=True)\nPYCODE"
        },
        {
          "name": "Load 1944 integration 1",
          "run": "echo '' >> /tmp/1944.b64"
        },
        {
          "name": "Load 1944 integration 2",
          "run": "echo '' >> /tmp/1944.b64"
        },
        {
          "name": "Load 1944 integration 3",
          "run": "echo '' >> /tmp/1944.b64"
        },
        {
          "name": "Load 1944 integration 4",
          "run": "echo '' >> /tmp/1944.b64"
        },
        {
          "name": "Apply verified driver and menu sources",
          "run": "python3 - <<'PYCODE'\nimport base64,gzip,hashlib,json\nfrom pathlib import Path\ndata=base64.b64decode(Path('/tmp/1944.b64').read_bytes())\nassert hashlib.sha256(data).hexdigest()=='f12aa21229d4d33ab696042e2db89b562aa8eaad38c0bd0c0930da88c256739a'\nfor name,s in json.loads(gzip.decompress(data)).items():Path(name).write_text(s)\nPYCODE"
        },
        {
          "name": "Compile with unchanged clocks and strict timing acceptance",
          "run": "docker run --rm --network host --entrypoint /bin/bash -v \"$GITHUB_WORKSPACE:/jtcores\" -w /jtcores \"$BUILD_IMAGE\" -ec 'mkdir -p pilot-reports; quartus_sh --version | tee pilot-reports/quartus-version.txt; grep -Eq \"20\\.1\\.1.*Build 720.*Lite Edition\" pilot-reports/quartus-version.txt; bash /jtcores/tests/llapi/build-1944.sh'"
        },
        {
          "name": "Package isolated 1944 test launcher and core",
          "run": "mkdir -p install/_Arcade/cores\ncp release/mister/jt1944.rbf install/_Arcade/cores/jt1944_llapi050.rbf\nsed -E 's@<rbf>[^<]+</rbf>@<rbf>jt1944_llapi050</rbf>@;s@<name>[^<]+</name>@<name>1944 - LLAPI 0.5 Test</name>@' tests/llapi/1944-LLAPI-Test.mra > 'install/_Arcade/1944 - LLAPI 0.5 Test.mra'\n(cd install && sha256sum _Arcade/cores/*.rbf _Arcade/*.mra > SHA256SUMS)"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "1944-llapi-050",
            "path": "install/",
            "if-no-files-found": "error"
          }
        },
        {
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "1944-build-reports",
            "path": "pilot-reports/"
          }
        }
      ]
    }
  }
}

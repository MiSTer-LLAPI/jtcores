name: CPS1 Enhanced 2.1 LLAPI 1.2
on:
  workflow_dispatch:
  push:
    branches: [test-cps1-multiplayer-llapi12]
    paths:
      - '.github/workflows/cps1-enhanced-2-1.yml'
      - '.github/cps1-enhanced2/**'
permissions:
  contents: read
concurrency:
  group: cps1-enhanced-2-1
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_IMAGE: jotego/jtcore20@sha256:a0397645aeac483f90718c89e5fd491c4889db6e4202bcba7f7f7770e14beb6b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: .github/cps1-enhanced2
      - name: Check out pinned official CPS1 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jotego/jtcores
          ref: 301596e73170828dec95162f8f03994c2ca52ec5
          path: jtcores
          persist-credentials: false
      - name: Apply Enhanced source to official CPS1 core
        working-directory: jtcores
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 301596e73170828dec95162f8f03994c2ca52ec5
          git submodule update --init --recursive --depth 1 modules/jt51 modules/jt6295 modules/fx68k
          support="$GITHUB_WORKSPACE/.github/cps1-enhanced2"
          git apply --check "$support/enhanced.patch"
          git apply --whitespace=nowarn "$support/enhanced.patch"
          git apply "$support/cps1-multiplayer.patch"
          mkdir -p tests/llapi pilot-reports
          cp "$support/build-cps1.sh" "$support/check-cps1-timing.py" tests/llapi/
      - name: Validate official MRAs and simulate six buttons
        run: |
          set -euo pipefail
          if ! command -v iverilog >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y iverilog
          fi
          support=.github/cps1-enhanced2
          hdl=jtcores/modules/jtframe/target/mister/hdl
          python3 "$support/check.py" mras
          for bench in "check_profiles cps1-profile-check" "tmnt_extra_players_tb cps1-extra-players-tb"; do
            read -r top file <<< "$bench"
            iverilog -g2012 -DJTFRAME_ENHANCED_CONTROLS -DJTFRAME_CPS1_MULTIPLAYER_AUTOFIRE -s "$top" -o /tmp/mp-test "$support/$file.sv" "$hdl/jtframe_serial_arcade.sv"
            vvp -N /tmp/mp-test
          done
          iverilog -g2012 -DCPS1 -s cps1_game_ports_tb -o /tmp/mp-ports "$support/cps1-game-ports-tb.sv" jtcores/cores/cps1/hdl/jtcps1_mmr.v
          vvp -N /tmp/mp-ports
          iverilog -g2012 -DJTFRAME_SNAC_TURBO_MASK=63 -s cps1_six_buttons_tb \
            -o /tmp/cps1-snac "$support/cps1-six-buttons-tb.sv" \
            "$hdl/jtframe_snac_turbo.sv"
          vvp -N /tmp/cps1-snac
          iverilog -g2012 -DJTFRAME_LLAPI_EXTRA_ACTIONS -s cps1_llapi_six_buttons_tb \
            -o /tmp/cps1-llapi "$support/cps1-llapi-six-buttons-tb.sv" \
            "$hdl/jtframe_llapi_arcade.sv"
          vvp -N /tmp/cps1-llapi
          iverilog -g2012 -DJTFRAME_LLAPI_EXTRA_ACTIONS -DJTFRAME_ENHANCED_CONTROLS \
            -DJTFRAME_LLAPI_HOLD_AUTOFIRE -DJTFRAME_SNAC_TURBO_MASK=63 \
            -DJTFRAME_CPS1_MULTIPLAYER_AUTOFIRE -s jtframe_serial_arcade -o /tmp/cps1-serial-elab \
            "$hdl/jtframe_serial_arcade.sv" "$hdl/jtframe_llapi_arcade.sv" \
            "$hdl/jtframe_snac_turbo.sv" "$hdl/jtframe_llapi_protocol.sv" \
            "$hdl/joydb15.v"
      - name: Compile CPS1 and accept positive timing margins only
        working-directory: jtcores
        run: |
          docker run --rm --network host --entrypoint /bin/bash -v "$PWD:/jtcores" -w /jtcores "$BUILD_IMAGE" -ec '
            quartus_sh --version | tee pilot-reports/quartus-version.txt
            grep -Eq "20\.1\.1.*Build 720.*Lite Edition" pilot-reports/quartus-version.txt
            bash tests/llapi/build-cps1.sh'
      - name: Verify generated menu and package 30 new games
        run: |
          set -euo pipefail
          support=.github/cps1-enhanced2
          project=jtcores/cores/cps1/mister
          python3 "$support/verificar-autofire.py" "$project/cfgstr.hex" \
            "$project/jtcps1.qsf" jtcores/modules/jtframe/target/mister/hdl/jtframe_mister.sv --static-only
          python3 "$support/check.py" menu "$project/cfgstr.hex"
          python3 "$support/check.py" package jtcores install
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cps1-Enhanced-2.1
          path: install/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cps1-Enhanced-2.1-reports
          path: jtcores/pilot-reports/
          if-no-files-found: warn
